<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <link rel="icon" href="/favicon.ico" type="image/svg+xml">
    <title>{app_title}</title>
    <style>
      :root {
        color-scheme: dark;
        background: #0e1116;
      }

      html,
      body {
        min-block-size: 100%;
        margin: 0;
        background: #0e1116;
      }

      #main {
        position: relative;
        isolation: isolate;
        min-block-size: 100vh;
      }

      #main:not([data-app-ready]) > .app-root {
        visibility: hidden;
        opacity: 0;
      }

      #main[data-app-ready] > .app-root {
        visibility: visible;
        opacity: 1;
        transition: opacity 180ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      #main[data-app-ready] > .app-boot {
        visibility: hidden;
        opacity: 0;
        transition:
          opacity 140ms ease-out,
          visibility 0s linear 140ms;
      }

      .app-boot {
        position: fixed;
        inset: 0;
        z-index: 1000;
        box-sizing: border-box;
        display: grid;
        gap: 1rem;
        inline-size: 100%;
        min-block-size: 100vh;
        min-block-size: 100dvh;
        margin-inline: auto;
        align-content: start;
        padding: 1rem 1.25rem;
        overflow: hidden;
        background: #0e1116;
        pointer-events: none;
        visibility: visible;
        opacity: 1;
      }

      .app-boot__header,
      .app-boot__nav,
      .app-boot__bar,
      .app-boot__line {
        border-radius: 0.25rem;
        background: #1d242e;
      }

      .app-boot__header {
        inline-size: min(100%, 18rem);
        block-size: 1.25rem;
      }

      .app-boot__nav {
        inline-size: min(100%, 14rem);
        block-size: 2rem;
      }

      .app-boot__bar {
        inline-size: 100%;
        block-size: 5rem;
      }

      .app-boot__line {
        inline-size: 100%;
        block-size: 2.5rem;
      }

      @media (max-width: 48rem) {
        .app-boot {
          padding-inline: 0.75rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #main[data-app-ready] > .app-root,
        #main[data-app-ready] > .app-boot {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="main" aria-busy="true">
      <div class="app-boot" aria-hidden="true">
        <div class="app-boot__header"></div>
        <div class="app-boot__nav"></div>
        <div class="app-boot__bar"></div>
        <div class="app-boot__line"></div>
        <div class="app-boot__line"></div>
      </div>
    </div>
  </body>
</html>

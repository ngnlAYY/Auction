[package]
name = "auction-web-admin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
auction-contracts.workspace = true
auction-web-shared.workspace = true
base64.workspace = true
chrono.workspace = true
dioxus = { workspace = true, features = ["router"] }
dioxus-i18n.workspace = true
# Admin 只用 HTTP/JSON；不继承 Public 的 WebSocket 能力。
gloo-net = { workspace = true, features = ["json"] }
gloo-timers.workspace = true
js-sys.workspace = true
serde.workspace = true
serde_json.workspace = true
unic-langid.workspace = true
# 补齐 Dioxus 的 `Location` 及精确 GET 请求所需 web-sys feature，详见根 Cargo.toml 说明。
web-sys = { workspace = true, features = ["BeforeUnloadEvent"] }
uuid.workspace = true
url.workspace = true
wasm-bindgen.workspace = true

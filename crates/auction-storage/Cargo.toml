[package]
name = "auction-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
auction-application.workspace = true
auction-domain.workspace = true
auction-observability.workspace = true
async-stream.workspace = true
chrono.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
futures-util.workspace = true
# 必填：PostgreSQL 18 是唯一后端；驱动与 rustls 传输只在本 crate 启用。
sqlx = { workspace = true, features = ["postgres", "tls-rustls-ring-webpki"] }
subtle.workspace = true
thiserror.workspace = true
# 必填：退款证明提交沿用原单调截止，覆盖连接池等待和完整事务。
tokio.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v5"] }
url.workspace = true

[dev-dependencies]
# 可选：结算退件巡检的贯通用例用真实 MoogleMail 解析器把详情页 HTML 变成领取证明，再经应用服务与
# 本 crate 入账；不进入运行时制品，不连接外部账号。
auction-integrations.workspace = true
# 可选：发送围栏故障的贯通用例经真实 Worker 运行时领取并分发本 crate 的投递，核对 Worker 错误信号；
# 不进入运行时制品，外部传输仍是脚本替身。
auction-jobs.workspace = true
# 可选：只给测试开启 tokio 暂停时间，确定性验证连接配额等待的 acquire 时限；不进入运行时制品。
tokio = { workspace = true, features = ["test-util"] }

[features]
default = []
# 可选：PostgreSQL 18 集成测试夹具；只在 `just test-db` 启用，默认构建与 `just test` 不连接数据库。
test-db = []

[lints]
# 可选：继承工作区统一 lint 策略，不在单包放宽。
workspace = true

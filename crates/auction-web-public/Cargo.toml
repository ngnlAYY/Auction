# 补齐 Dioxus 的 `Location` 及精确 GET 请求所需 web-sys feature，详见根 Cargo.toml 说明。
web-sys.workspace = true

[lints]
# 可选：继承工作区统一 lint 策略，不在单包放宽。
workspace = true

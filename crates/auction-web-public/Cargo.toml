[package]
name = "auction-web-public"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
auction-contracts.workspace = true
auction-web-shared.workspace = true
dioxus = { workspace = true, features = ["router"] }
dioxus-i18n.workspace = true
chrono.workspace = true
futures-util.workspace = true
# Public 同时使用 HTTP/JSON 与实时 WebSocket。
gloo-net = { workspace = true, features = ["json", "websocket"] }
gloo-timers.workspace = true
js-sys.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
unic-langid.workspace = true
url.workspace = true
wasm-bindgen.workspace = true
uuid.workspace = true
# 必填：补齐 Dioxus 的 `Location`、精确 GET 与跨标签页会话通知所需 `StorageEvent`，其余 feature 见根清单。
# 列设置直接使用浏览器存储与焦点 API，显式声明 feature，不依赖其他包顺带启用。
# 目录行的详情入口需要事件目标与文本选区，以区分整行点击、行内控件与拖选文本。
web-sys = { workspace = true, features = ["Document", "Element", "Event", "EventTarget", "HtmlElement", "KeyboardEvent", "MouseEvent", "Selection", "Storage", "StorageEvent", "Window"] }

[lints]
# 可选：继承工作区统一 lint 策略，不在单包放宽。
workspace = true

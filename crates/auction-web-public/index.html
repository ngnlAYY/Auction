<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#0e1116">
    <link rel="icon" href="/favicon.ico">
    <title>{app_title}</title>
    <style>
      /* 未分层的启动兜底不能覆盖 WASM 设置后的主题与打印 color-scheme。 */
      :root:not([data-theme]) {
        color-scheme: dark;
        background: #0e1116;
      }

      html,
      body {
        min-block-size: 100%;
        margin: 0;
        background: var(--color-bg, #0e1116);
      }

      #main {
        position: relative;
        isolation: isolate;
        min-block-size: 100vh;
        min-block-size: 100dvh;
      }

      #main:not([data-app-ready]) > .app-root {
        visibility: hidden;
        opacity: 0;
      }

      #main[data-app-ready] > .app-root {
        visibility: visible;
        opacity: 1;
        transition: opacity 180ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      #main[data-app-ready] > .app-boot {
        visibility: hidden;
        opacity: 0;
        transition:
          opacity 140ms ease-out,
          visibility 0s linear 140ms;
      }

      .app-boot {
        position: fixed;
        inset: 0;
        z-index: 1000;
        box-sizing: border-box;
        display: grid;
        gap: 1rem;
        inline-size: 100%;
        min-block-size: 100vh;
        min-block-size: 100dvh;
        margin-inline: auto;
        align-content: start;
        padding: 1rem 0.75rem;
        padding-block: max(1rem, env(safe-area-inset-top, 0px)) max(1rem, env(safe-area-inset-bottom, 0px));
        padding-inline: max(0.75rem, env(safe-area-inset-left, 0px)) max(0.75rem, env(safe-area-inset-right, 0px));
        overflow: hidden;
        background: #0e1116;
        pointer-events: none;
        visibility: visible;
        opacity: 1;
      }

      .app-boot__header,
      .app-boot__bar,
      .app-boot__line {
        border-radius: 0.25rem;
        background: #1d242e;
      }

      .app-boot__header {
        inline-size: min(100%, 34rem);
        block-size: 1.25rem;
      }

      .app-boot__bar {
        inline-size: 100%;
        block-size: 5rem;
      }

      .app-boot__line {
        inline-size: 100%;
        block-size: 2.5rem;
      }

      /* noscript 提示：JS 被禁用时以整屏覆盖层遮住骨架屏，静态说明需要启用 JavaScript。
         CSP script-src 禁止内联脚本，因此这里只能用纯 HTML + CSS。 */
      .boot-noscript {
        position: fixed;
        inset: 0;
        z-index: 2000;
        box-sizing: border-box;
        display: grid;
        place-content: center;
        padding: 1.5rem;
        background: #0e1116;
        color: #d7dee8;
        font: 1rem/1.6 system-ui, sans-serif;
        text-align: center;
      }

      /* 15 秒未就绪只说明等待较久；真实运行异常由 Rust panic 钩子的失败标记单独触发。 */
      .app-boot__slow,
      .app-boot__error {
        margin: 2rem 0 0;
        color: #e3b8b8;
        font: 0.95rem/1.6 system-ui, sans-serif;
        text-align: center;
      }

      .app-boot__slow {
        color: #d7dee8;
        opacity: 0;
        visibility: hidden;
        animation: app-boot-error-reveal 0.01s linear 15s forwards;
      }

      /* 就绪后彻底移除慢加载提示：揭示动画把它设为 visible 会覆盖父层的 hidden，透明的启动层里
         它仍留在无障碍树中，读屏会在页面早已可用时播报“加载较慢”。 */
      .app-boot__error,
      #main[data-app-ready] .app-boot__slow,
      #main[data-app-failed] .app-boot__slow {
        display: none;
      }

      #main[data-app-failed] .app-boot__error {
        display: block;
      }

      @keyframes app-boot-error-reveal {
        to {
          opacity: 1;
          visibility: visible;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #main[data-app-ready] > .app-root,
        #main[data-app-ready] > .app-boot {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="main" aria-busy="true">
      <div class="app-boot">
        <div class="app-boot__header"></div>
        <div class="app-boot__bar"></div>
        <div class="app-boot__line"></div>
        <div class="app-boot__line"></div>
        <p class="app-boot__slow" role="status">Loading is taking longer than usual. Please wait, or refresh the page.</p>
        <p class="app-boot__error" role="alert">The application encountered an error. Refresh the page to try again.</p>
      </div>
      <noscript>
        <div class="boot-noscript">This application requires JavaScript. Please enable JavaScript in your browser and refresh the page.</div>
      </noscript>
    </div>
  </body>
</html>

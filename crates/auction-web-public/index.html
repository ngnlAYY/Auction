<!doctype html>
<html lang="en">
  <!--
    lang 启动窗口期说明：这里的 lang="en" 是静态兜底值。WASM 就绪前若用户偏好其他语言，
    屏幕阅读器会按错误语言发音几秒钟。已知无法低成本修正：CSP `script-src 'self'`（见
    auction-http/src/http/shared/boundary.rs，不含 'unsafe-inline'）禁止内联脚本，无法
    在 WASM 就绪前用内联脚本按 localStorage 的 hv.lang 修正 lang；外联小脚本需额外打通
    rust-embed 内嵌资源链路，收益（数秒窗口期的发音）不抵复杂度与安全面收缩，故接受现状。
    WASM 就绪后 auction-web-shared 的 i18n::sync_document_language 会立即把 <html lang>
    修正为用户偏好语言。
  -->
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <link rel="icon" href="/favicon.ico">
    <title>{app_title}</title>
    <style>
      :root {
        color-scheme: dark;
        background: #0e1116;
      }

      html,
      body {
        min-block-size: 100%;
        margin: 0;
        background: #0e1116;
      }

      #main {
        position: relative;
        isolation: isolate;
        min-block-size: 100vh;
      }

      #main:not([data-app-ready]) > .app-root {
        visibility: hidden;
        opacity: 0;
      }

      #main[data-app-ready] > .app-root {
        visibility: visible;
        opacity: 1;
        transition: opacity 180ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      #main[data-app-ready] > .app-boot {
        visibility: hidden;
        opacity: 0;
        transition:
          opacity 140ms ease-out,
          visibility 0s linear 140ms;
      }

      .app-boot {
        position: fixed;
        inset: 0;
        z-index: 1000;
        box-sizing: border-box;
        display: grid;
        gap: 1rem;
        inline-size: 100%;
        min-block-size: 100vh;
        min-block-size: 100dvh;
        margin-inline: auto;
        align-content: start;
        padding: 1rem 1.5rem;
        overflow: hidden;
        background: #0e1116;
        pointer-events: none;
        visibility: visible;
        opacity: 1;
      }

      .app-boot__header,
      .app-boot__bar,
      .app-boot__line {
        border-radius: 0.25rem;
        background: #1d242e;
      }

      .app-boot__header {
        inline-size: min(100%, 34rem);
        block-size: 1.25rem;
      }

      .app-boot__bar {
        inline-size: 100%;
        block-size: 5rem;
      }

      .app-boot__line {
        inline-size: 100%;
        block-size: 2.5rem;
      }

      /* noscript 提示：JS 被禁用时以整屏覆盖层遮住骨架屏，静态说明需要启用 JavaScript。
         CSP script-src 禁止内联脚本，因此这里只能用纯 HTML + CSS。 */
      .boot-noscript {
        position: fixed;
        inset: 0;
        z-index: 2000;
        box-sizing: border-box;
        display: grid;
        place-content: center;
        padding: 1.5rem;
        background: #0e1116;
        color: #d7dee8;
        font: 1rem/1.6 system-ui, sans-serif;
        text-align: center;
      }

      /* WASM 加载失败降级：错误提示初始隐藏，仅当应用长时间未就绪（WASM 加载或执行失败）
         时通过纯 CSS 动画在约 15 秒后自动显现；WASM 正常就绪时 data-app-ready 会隐藏整个
         .app-boot 骨架，该提示随骨架一起消失，因此全程无需任何脚本。 */
      .app-boot__error {
        margin: 2rem 0 0;
        color: #e3b8b8;
        font: 0.95rem/1.6 system-ui, sans-serif;
        text-align: center;
        opacity: 0;
        visibility: hidden;
        animation: app-boot-error-reveal 0.01s linear 15s forwards;
      }

      @keyframes app-boot-error-reveal {
        to {
          opacity: 1;
          visibility: visible;
        }
      }

      @media (max-width: 48rem) {
        .app-boot {
          inline-size: 100%;
          padding-inline: 0.75rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #main[data-app-ready] > .app-root,
        #main[data-app-ready] > .app-boot {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="main" aria-busy="true">
      <div class="app-boot" aria-hidden="true">
        <div class="app-boot__header"></div>
        <div class="app-boot__bar"></div>
        <div class="app-boot__line"></div>
        <div class="app-boot__line"></div>
        <p class="app-boot__error">The application could not be loaded. Check your network connection and refresh the page.</p>
      </div>
      <noscript>
        <div class="boot-noscript">This application requires JavaScript. Please enable JavaScript in your browser and refresh the page.</div>
      </noscript>
    </div>
  </body>
</html>

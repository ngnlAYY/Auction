[package]
name = "auction-cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
auction-application.workspace = true
redis = { workspace = true, optional = true, features = ["connection-manager", "tokio-rustls-comp"] }
rustls = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["sync", "time"] }
thiserror.workspace = true

[features]
default = []
redis = ["dep:redis", "dep:rustls", "dep:tokio"]

[lints]
# 可选：继承工作区统一 lint 策略，不在单包放宽。
workspace = true

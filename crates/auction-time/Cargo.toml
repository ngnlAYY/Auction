[package]
name = "auction-time"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# 可选：存储层启用后，Timestamp 可直接绑定到 PostgreSQL timestamptz 参数并从结果行读取。
postgres = ["dep:jiff-sqlx", "dep:sqlx"]

[dependencies]
# 必填：时刻、时长与日历运算的底层实现；文本格式由本 crate 自己控制。
jiff.workspace = true
# 可选：只随 postgres feature 编译，提供 timestamptz 的编解码。
jiff-sqlx = { workspace = true, optional = true }
serde.workspace = true
sqlx = { workspace = true, optional = true, features = ["postgres"] }

# 必填：浏览器目标没有系统时钟，`Timestamp::now()` 在该目标上读取 `Date.now()`。
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys.workspace = true

[dev-dependencies]
# 必填：墙上时间解析的回归测试需要内嵌的 IANA 时区数据。
jiff = { workspace = true, features = ["tzdb-bundle-always"] }
serde_json.workspace = true

[lints]
# 可选：继承工作区统一 lint 策略，不在单包放宽。
workspace = true

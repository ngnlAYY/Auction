[package]
name = "auction-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
auction-application.workspace = true
auction-domain.workspace = true
auction-time.workspace = true
# 必填：标准 cron 未声明时区时沿用进程本地时区（tz-system），具名时区取内嵌的 IANA 数据。
jiff = { workspace = true, features = ["tz-system", "tzdb-bundle-always"] }
libc.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
url.workspace = true
uuid.workspace = true

[lints]
# 可选：继承工作区统一 lint 策略，不在单包放宽。
workspace = true

[workspace]
resolver = "2"
members = [
    "apps/admin-api",
    "apps/auctionctl",
    "apps/public-api",
    "apps/server",
    "apps/worker",
    "crates/auction-application",
    "crates/auction-cache",
    "crates/auction-config",
    "crates/auction-contracts",
    "crates/auction-domain",
    "crates/auction-http",
    "crates/auction-integrations",
    "crates/auction-jobs",
    "crates/auction-observability",
    "crates/auction-process",
    "crates/auction-setup",
    "crates/auction-storage",
    "crates/auction-web-admin",
    "crates/auction-web-public",
    "crates/auction-web-shared",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
publish = false

[workspace.dependencies]
# 工作区内部 crate
auction-application = { path = "crates/auction-application" }
auction-cache = { path = "crates/auction-cache", default-features = false }
auction-config = { path = "crates/auction-config" }
auction-contracts = { path = "crates/auction-contracts" }
auction-domain = { path = "crates/auction-domain" }
auction-http = { path = "crates/auction-http" }
auction-integrations = { path = "crates/auction-integrations" }
auction-jobs = { path = "crates/auction-jobs" }
auction-observability = { path = "crates/auction-observability" }
auction-process = { path = "crates/auction-process" }
auction-setup = { path = "crates/auction-setup", default-features = false }
auction-storage = { path = "crates/auction-storage" }
auction-web-admin = { path = "crates/auction-web-admin" }
auction-web-public = { path = "crates/auction-web-public" }
auction-web-shared = { path = "crates/auction-web-shared" }

# 异步运行时：Tokio 1.51.x 是官方 LTS 分支，只接受该分支内的补丁升级。
tokio = { version = "~1.51.4", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

# HTTP 与 Web
axum = { version = "0.8.9", features = ["macros", "ws"] }
# 直接识别 Axum WebSocket 的类型化容量错误，才能恢复旧 v1 的 1009 close 契约。
tungstenite = { version = "0.29.0", default-features = false }
# 浏览器端使用 Dioxus CSR：产物为静态 WASM/JS/HTML，由 auction-http 内嵌后提供。
# 不启用 fullstack/server，避免第二套 HTTP 服务器与 auction-http 的路由所有权冲突。
dioxus = { version = "0.7.10", default-features = false, features = [
    "launch",
    "lib",
    "web",
] }
# 原生 i18n：Project Fluent 后端，locale 资源在编译期内嵌。
dioxus-i18n = "0.5.1"
unic-langid = { version = "0.9.6", features = ["macros"] }
gloo-net = { version = "0.6.0", default-features = false, features = ["http", "json", "websocket"] }
gloo-timers = { version = "0.3.0", features = ["futures"] }
js-sys = "0.3.104"
futures-util = "0.3.34"
async-stream = "0.3.6"
hyper = { version = "1.11.0", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.20", features = [
    "server-auto",
    "server-graceful",
    "service",
    "tokio",
] }
httpdate = "1.0.3"
http-body-util = "0.1.5"
ipnet = "2.12.0"
mime = "0.3.17"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls-no-provider"] }
scraper = "0.24.0"
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
url = "2.5.8"
# 上游缺陷补齐：dioxus-web 0.7.10 的 src/history.rs 无条件调用 `Window::location()`，
# 但它的 web-sys 依赖没有声明 `Location` feature，只能靠依赖图中其他 crate 顺带启用。
# 这里显式启用该 feature；升级 Dioxus 时应复查上游是否已修，届时可移除对应项。
# AbortController/AbortSignal 供 Public 浏览器请求恢复旧版 10 秒取消边界；Request/RequestInit
# 允许共用 GET 边界绕过 gloo-net 0.6.0 给已有 query 追加空参数的缺陷。
web-sys = { version = "0.3.104", features = [
    "AbortController",
    "AbortSignal",
    "History",
    "Location",
    "Request",
    "RequestInit",
] }
wasm-bindgen = "0.2.127"

# 持久化基础能力。具体数据库驱动由 auction-storage 的窄发布 feature 引入。
sqlx = { version = "0.9.0", default-features = false, features = [
    "chrono",
    "json",
    "macros",
    "migrate",
    "runtime-tokio",
    "uuid",
] }

# Redis 只由 cache-redis feature 引入；关闭默认 feature，避免附带脚本、流和大数支持。
redis = { version = "1.6.0", default-features = false }

# 数据与错误
anyhow = "1.0.104"
base64 = "0.22.1"
libc = "0.2.189"
# `now` 提供 `Utc::now()`；`clock` 还用于恢复旧版标准 cron 的进程本地时区语义。
chrono = { version = "0.4.45", default-features = false, features = ["clock", "now", "serde", "std"] }
chrono-tz = "0.10.4"
croner = { version = "3.0.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# HMAC 0.12 与现有 SHA-256 0.10 共用 digest 类型，不为会话修复升级整个哈希依赖图。
hmac = "0.12.1"
sha2 = "0.10.9"
ring = "0.17.14"
subtle = "2.6.1"
thiserror = "2.0.20"
toml = "1.1.4"
uuid = { version = "1.24.1", features = ["js", "serde", "v4", "v5"] }

# CLI 与可观测性
clap = { version = "4.6.6", features = ["derive"] }
opentelemetry = { version = "0.32.0", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = [
    "http-proto",
    "reqwest-client",
    "trace",
] }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = [
    "experimental_trace_batch_span_processor_with_async_runtime",
    "rt-tokio",
    "trace",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.33.0"
tower = { version = "0.5.3", features = ["util"] }
prometheus = { version = "0.14.0", features = ["process"] }

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

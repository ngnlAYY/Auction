[workspace]
resolver = "2"
members = [
    "apps/admin-api",
    "apps/auctionctl",
    "apps/public-api",
    "apps/worker",
    "crates/auction-application",
    "crates/auction-config",
    "crates/auction-contracts",
    "crates/auction-domain",
    "crates/auction-http",
    "crates/auction-integrations",
    "crates/auction-jobs",
    "crates/auction-observability",
    "crates/auction-storage",
    "crates/auction-web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
# Internal crates
auction-application = { path = "crates/auction-application" }
auction-config = { path = "crates/auction-config" }
auction-contracts = { path = "crates/auction-contracts" }
auction-domain = { path = "crates/auction-domain" }
auction-http = { path = "crates/auction-http" }
auction-integrations = { path = "crates/auction-integrations" }
auction-jobs = { path = "crates/auction-jobs" }
auction-observability = { path = "crates/auction-observability" }
auction-storage = { path = "crates/auction-storage" }
auction-web = { path = "crates/auction-web" }

# Async/runtime
async-trait = "0.1.92"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }

# HTTP and Web
axum = { version = "0.8.9", features = ["macros"] }
leptos = { version = "0.8.20", default-features = false }
leptos_axum = "0.8.10"
leptos_meta = { version = "0.8.6", default-features = false }
leptos_router = { version = "0.8.15", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
tower-http = { version = "0.7.0", features = ["compression-full", "cors", "trace"] }
url = "2.5.8"

# Persistence
# Both database drivers are compiled into the storage adapter. The configured
# URL selects the backend at runtime.
sqlx = { version = "0.9.0", default-features = false, features = [
    "chrono",
    "json",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "sqlite",
    "tls-rustls-ring-webpki",
] }

# Data and errors
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde", "clock"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1.4"
uuid = { version = "1.24.1", features = ["serde", "v4", "v5"] }

# CLI and observability
clap = { version = "4.6.6", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# Browser-only helpers used by the Leptos hydration build
console_error_panic_hook = "0.1.7"
wasm-bindgen = "0.2.127"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

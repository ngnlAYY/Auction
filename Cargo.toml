[workspace]
# 必填：按各包 MSRV 优先解析兼容版本；最终仍由 --locked 与独立 MSRV 门禁约束。
resolver = "3"
# 必填：两个目录只放工作区包，新增包自动纳入；不再维护第二份成员清单。
members = ["apps/*", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
publish = false

[workspace.dependencies]
# 工作区内部 crate
auction-application = { path = "crates/auction-application" }
auction-config = { path = "crates/auction-config" }
auction-contracts = { path = "crates/auction-contracts" }
auction-domain = { path = "crates/auction-domain" }
auction-http = { path = "crates/auction-http" }
auction-integrations = { path = "crates/auction-integrations" }
auction-jobs = { path = "crates/auction-jobs" }
auction-observability = { path = "crates/auction-observability" }
auction-process = { path = "crates/auction-process" }
auction-setup = { path = "crates/auction-setup", default-features = false }
auction-storage = { path = "crates/auction-storage" }
auction-web-admin = { path = "crates/auction-web-admin" }
auction-web-public = { path = "crates/auction-web-public" }
auction-web-shared = { path = "crates/auction-web-shared" }

# 异步运行时：Tokio 1.53.x 是官方 LTS 分支，后续只接受该分支内的补丁升级。
tokio = { version = "~1.53.3", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

# HTTP 与 Web
# 查询参数由 HTTP owner 严格解析；不启用未使用的宏、Form/Query 提取器。
# 未消费 OriginalUri；禁用自动 URI 复制和逐请求 extension 分配，路由指标继续使用 MatchedPath。
axum = { version = "0.8.9", default-features = false, features = [
    "http1",
    "json",
    "matched-path",
    "tokio",
    "tower-log",
    "tracing",
    "ws",
] }
# 必填：与 Axum 的实际传递版本一致；跨版本 Error 类型无法 downcast，会丢失 v1 的 1009 close 契约。
tungstenite = { version = "0.29.0", default-features = false }
# 浏览器端使用 Dioxus CSR：产物为静态 WASM/JS/HTML，由 auction-http 内嵌后提供。
# 不启用 fullstack/server，避免第二套 HTTP 服务器与 auction-http 的路由所有权冲突。
dioxus = { version = "0.7.10", default-features = false, features = [
    "launch",
    "lib",
    "web",
] }
# 原生 i18n：Project Fluent 后端，locale 资源在编译期内嵌。
dioxus-i18n = "0.6.0"
unic-langid = { version = "0.9.6", features = ["macros"] }
# 共享层只用 HTTP；JSON 和 WebSocket 由实际调用的 surface 显式启用。
gloo-net = { version = "0.7.0", default-features = false, features = ["http"] }
gloo-timers = { version = "0.4.0", features = ["futures"] }
js-sys = "0.3.106"
futures-util = "0.3.34"
async-stream = "0.3.6"
hyper = { version = "1.12.0", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.21", features = [
    "server-auto",
    "server-graceful",
    "service",
    "tokio",
] }
httpdate = "1.0.3"
http-body-util = "0.1.5"
ipnet = "2.12.2"
mime = "0.3.17"
# 外部客户端共享 rustls；JSON 由实际使用的 Worker control 单独启用。
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
# 可选：备份异机副本的 R2（S3 兼容）客户端；只开 S3 基础协议、reqwest 传输与 ring，不启用会引入 aws-lc-rs 的 `aws` feature。
object_store = { version = "0.14.2", default-features = false, features = ["aws-base", "reqwest", "ring"] }
# 只使用 HTML/CSS 库 API 与解析错误，不引入默认 CLI 的 getopts 依赖。
scraper = { version = "0.29.0", default-features = false, features = ["errors"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
url = "2.5.8"
# 上游缺陷补齐：dioxus-web 0.7.10 的 src/history.rs 无条件调用 `Window::location()`，
# 但它的 web-sys 依赖没有声明 `Location` feature，只能靠依赖图中其他 crate 顺带启用。
# 这里显式启用该 feature；升级 Dioxus 时应复查上游是否已修，届时可移除对应项。
# AbortController/AbortSignal 保持浏览器请求的 10 秒取消边界；Request/RequestInit
# 供共享 GET 保留精确 URL，并统一响应头、正文读取与取消的总预算。
web-sys = { version = "0.3.106", features = [
    "AbortController",
    "AbortSignal",
    "History",
    "Location",
    "Request",
    "RequestInit",
] }
wasm-bindgen = "0.2.129"

# 持久化基础能力。具体数据库驱动由 auction-storage 的窄发布 feature 引入。
sqlx = { version = "0.9.0", default-features = false, features = [
    "chrono",
    "json",
    "macros",
    "migrate",
    "runtime-tokio",
    "uuid",
] }

# 数据与错误
anyhow = "1.0.104"
# 只使用现有 GeneralPurpose 引擎；不为未调用的 SIMD 引擎开启默认 simd-unsafe。
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
libc = "0.2.190"
# 共享图只需 UTC 时间；进程本地时区的 clock feature 由配置 owner 单独启用。
chrono = { version = "0.4.45", default-features = false, features = ["now", "serde", "std"] }
chrono-tz = "0.10.4"
# 调度边界先规范化旧版五字段语法，仅启用现有 chrono 后端，不引入 jiff。
croner = { version = "4.0.1", default-features = false, features = ["chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# HMAC/SHA-256 配套使用 digest 0.11；不改变摘要算法、输入编码或会话域分隔符。
hmac = "0.13.0"
sha2 = "0.11.1"
ring = "0.17.14"
subtle = "2.6.1"
thiserror = "2.0.21"
toml = "1.1.8"
# v5 仅由实际生成确定性标识的 owner 启用，Public/Shared 不承担 SHA-1 生成依赖。
uuid = { version = "1.28.0", features = ["js", "serde", "v4"] }

# CLI 与可观测性
clap = { version = "4.6.7", features = ["derive"] }
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = [
    "http-proto",
    "reqwest-client",
    "trace",
] }
# 自有有界批处理器直接使用 Tokio；不启用 SDK 自带的实验性异步批处理器与 runtime 适配。
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
tracing = "0.1.44"
# 日志只输出 JSON 且显式关闭 ANSI；不启用默认 `ansi`，其余默认能力（fmt/std/smallvec/tracing-log）显式保留。
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "env-filter",
    "fmt",
    "json",
    "smallvec",
    "std",
    "tracing-log",
] }
# 可选：只装配 trace layer；指标由 Prometheus 拥有，保留日志归一化而不编译未使用的 MetricsLayer。
tracing-opentelemetry = { version = "0.34.0", default-features = false, features = ["tracing-log"] }
tower = { version = "0.5.3", features = ["util"] }
# 指标只导出 Prometheus 文本；保留进程 collector，使用 plain_model，避免二进制 protobuf 编码依赖。
prometheus = { version = "0.14.0", default-features = false, features = ["process"] }

[profile.dev]
# 可选：保留文件/行号回溯，省去完整类型与局部变量调试信息；需要时用 CARGO_PROFILE_DEV_DEBUG=2 恢复。
debug = "line-tables-only"

[profile.release]
# 可选：后端运行性能优先，保持通用目标指令集；不隐式采用构建机 native CPU。
opt-level = 3
# 可选：跨 crate 完整优化，增加链接时间和峰值内存；收益须由代表性负载测量。
lto = "fat"
# 可选：单代码生成单元扩大优化范围，牺牲编译并行度。
codegen-units = 1
# 可选：保留 Tokio 任务 panic 隔离和 Drop/drain 语义，不为体积改成进程 abort。
panic = "unwind"
# 可选：整数溢出失败关闭；回退时单独恢复本声明，并重建原生与 WASM 制品。
overflow-checks = true
# 可选：发布禁用增量编译，固定优化条件。
incremental = false

[profile.wasm-release]
# 必填：浏览器保持独立体积优化档，不继承后端 CPU 定向参数。
inherits = "release"
# 可选：以下载、解析体积优先，不宣称浏览器计算吞吐最优。
opt-level = "z"
# LTO、代码生成单元、增量策略与开启的溢出检查继承 release，不重复声明。
# 可选：浏览器保持 abort；install_panic_hook 在 trap 前展示静态错误横幅。
panic = "abort"

[workspace.lints.rust]
# 可选：把编译器默认 warn 的 must_use 忽略提升为错误，避免悄悄丢弃 Result/Guard。
unused_must_use = "deny"
# 可选：unsafe fn 内的操作仍须显式 unsafe 块，保持审计边界可见。
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# 可选：调试残留与未完成标记一律阻断，不靠评审记忆。
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# 可选：生产路径不得因 unwrap/expect panic；测试豁免集中在 clippy.toml。
unwrap_used = "deny"
expect_used = "deny"

# PostgreSQL 敏感配置模板；复制到受信目录，替换占位值并设为 0600，真实值不得提交，也不得进入角色主配置、runtime、日志、审计或 DTO。
# 三角色通过 secrets_file 引用；以下根字段必须位于 [database] 之前。

# 外部打卡服务按决策暂缓启用；以下地址只由 CLI 读取 Worker 引用的敏感文件，保持注释或空值。
# 可选：定时备份成功后的 HTTPS GET 地址，默认未配置；启用外部打卡后填写完整地址，禁止 userinfo。
# backup_heartbeat_success_url = ""
# 可选：任一备份阶段失败后的 HTTPS GET 地址，默认未配置；启用外部打卡后填写完整地址，禁止 userinfo。
# backup_heartbeat_failure_url = ""

# 可选：Worker 外部存活心跳的 HTTPS GET 地址，默认未配置；只在 Worker readiness 正常时定期报到，地址不得进入日志。
# worker_heartbeat_url = ""
# 可选：独立 webhook 告警的 HTTPS POST 地址，默认未配置；仅当 worker.operations_alert.webhook_enabled = true 时必填，地址不得进入日志。
# operations_alert_webhook_url = ""

# 可选：默认省略，backup.offsite.enabled = true 时必填；只授予备份 bucket 对象读写权限的 R2 access key。
# backup_r2_access_key_id = "CHANGE_ME"
# 可选：默认省略，启用异机副本时必填；与 access key 成对，禁止控制字符，不能使用环境或实例元数据凭据。
# backup_r2_secret_access_key = "CHANGE_ME"

# OTLP headers 使用逗号分隔的 key=value，名称和值支持 URL 百分号编码，不得覆盖 content-type、host、traceparent 等协议字段。
# 可选：Public 启用 tracing 时使用的专属 OTLP/HTTP headers。
# public_otlp_headers = "authorization=Bearer%20CHANGE_ME"
# 可选：Admin 启用 tracing 时使用的专属 OTLP/HTTP headers。
# admin_otlp_headers = "authorization=Bearer%20CHANGE_ME"
# 可选：Worker 启用 tracing 时使用的专属 OTLP/HTTP headers。
# worker_otlp_headers = "authorization=Bearer%20CHANGE_ME"

# 可选：站点管理员身份，与 admin_secret 成对配置，不是数据库账号。
# admin_actor = "admin"
# 可选：Admin 登录共享密钥，至少 16 字节，生产使用随机值。
# admin_secret = "CHANGE_ME_TO_A_RANDOM_SECRET_OF_AT_LEAST_16_BYTES"

# 四组 AES-256-GCM 数据密钥分别独立，不能复用；每组标识与密钥必须成对配置。
# 可选：装备 key 数据密钥的非秘密轮换标识。
# equipment_data_key_id = "primary-2026"
# 可选：装备 key 数据密钥，32 字节材料的标准 Base64 编码。
# equipment_data_key = "CHANGE_ME_TO_32_BYTE_BASE64_DATA_KEY"
# 可选：用户注册/换绑登录 key 数据密钥的非秘密轮换标识。
# user_login_data_key_id = "user-login-primary-2026"
# 可选：登录 key 数据密钥，32 字节材料的标准 Base64 编码。
# user_login_data_key = "CHANGE_ME_TO_32_BYTE_BASE64_DATA_KEY"
# 可选：Admin A32 外部 Cookie 数据密钥的非秘密轮换标识。
# credential_data_key_id = "credential-primary-2026"
# 可选：外部 Cookie 数据密钥，32 字节材料的标准 Base64 编码。
# credential_data_key = "CHANGE_ME_TO_32_BYTE_BASE64_DATA_KEY"
# 可选：MoogleMail 诊断归档独立父密钥（与凭据/装备父密钥分开轮换）。
# mail_diagnostics_data_key_id = "mail-diagnostics-primary-2026"
# 可选：MoogleMail 诊断归档数据密钥，32 字节材料的标准 Base64 编码。
# mail_diagnostics_data_key = "CHANGE_ME_TO_32_BYTE_BASE64_DATA_KEY"

# 可选：保留解密的旧密钥。轮换时把原当前密钥移入对应数组；retired_at 为停止写入时间
# （RFC 3339，不得在未来），保留期固定为 retired_at + 12 个月，先执行
# `auction-cli keys reencrypt` 再考虑删除。
# [[equipment_previous_data_keys]]
# 可选：旧装备密钥的非秘密标识。
# id = "equipment-2025-11"
# 可选：旧装备密钥材料，32 字节标准 Base64。
# key = "CHANGE_ME_TO_32_BYTE_BASE64_DATA_KEY"
# 可选：停止写入时间，RFC 3339；保留期固定 12 个月。
# retired_at = "2026-11-05T00:00:00Z"
# [[user_login_previous_data_keys]]
# 可选：旧登录 key密钥的非秘密标识。
# id = "user-login-2025-11"
# 可选：旧登录 key密钥材料，32 字节标准 Base64。
# key = "CHANGE_ME_TO_32_BYTE_BASE64_DATA_KEY"
# 可选：停止写入时间，RFC 3339；保留期固定 12 个月。
# retired_at = "2026-11-05T00:00:00Z"
# [[credential_previous_data_keys]]
# 可选：旧凭据密钥的非秘密标识。
# id = "credential-2025-11"
# 可选：旧凭据密钥材料，32 字节标准 Base64。
# key = "CHANGE_ME_TO_32_BYTE_BASE64_DATA_KEY"
# 可选：停止写入时间，RFC 3339；保留期固定 12 个月。
# retired_at = "2026-11-05T00:00:00Z"
# [[mail_diagnostics_previous_data_keys]]
# 可选：旧诊断归档密钥的非秘密标识。
# id = "mail-diagnostics-2025-11"
# 可选：旧诊断归档密钥材料，32 字节标准 Base64。
# key = "CHANGE_ME_TO_32_BYTE_BASE64_DATA_KEY"
# 可选：停止写入时间，RFC 3339；保留期固定 12 个月。
# retired_at = "2026-11-05T00:00:00Z"

# 必填区块：PostgreSQL 五字段连接参数。
[database]
# 必填：主机名或 IP 地址，不含协议、端口、账号或路径。
host = "127.0.0.1"
# 必填：TCP 端口，范围 1-65535，通常为 5432。
port = 5432
# 必填：数据库账号，按原文填写，不做 URL 编码。
username = "auction"
# 必填：数据库密码，特殊字符按原文填写；真实值不得提交。
password = "CHANGE_ME"
# 必填：预先创建的数据库名称，不从账号或环境变量推导。
name = "auction"

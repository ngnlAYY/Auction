# 敏感配置结构模板；这里只包含本地 SQLite 示例，不得写入真实凭据。
# 生产部署时复制为 ops/config/auction.secret.toml，限制文件权限并让主配置引用该文件。
# 以下敏感字段在语法上均可省略；是否需要由启用的角色和能力决定。
# 所有值都只能放在敏感文件中，不能放回主配置、runtime 文件、日志或 DTO。

# 可选但数据库能力需要：数据库 URL 只能出现在敏感配置中。
# 此示例选择单机 SQLite Lite 档；生产完整档应使用 postgres:// 或 postgresql://。
database_url = "sqlite://./var/auction.db"

# 可选：启用主配置 cache.backend = "redis" 时必须提供。
# 密码、令牌和 TLS 参数不得提交；真实值应写入被 Git 忽略的敏感文件。
# redis_url = "rediss://default:CHANGE_ME@redis.example.invalid:6379/0"

# 可选：启用会话签名能力时提供；真实值只能存在于被忽略的敏感文件或外部挂载文件中。
# session_signing_key = "CHANGE_ME"
# 可选：启用 E-Hentai 外部集成时提供，内容为完整 Cookie 字符串。
# ehentai_cookie = "CHANGE_ME"
# 可选：启用 MoogleMail 外部集成时提供，内容为完整 Cookie 字符串。
# mooglemail_cookie = "CHANGE_ME"

# 可选：OTLP/HTTP 认证或路由 headers；只能放在敏感文件，使用逗号分隔的 key=value。
# header 名称和值支持 URL 百分号编码；不得覆盖 content-type、host、traceparent 等协议字段。
# 只在对应主配置启用 tracing 时提供，真实值不得提交。
# public_otlp_headers = "authorization=Bearer%20CHANGE_ME"
# worker_otlp_headers = "authorization=Bearer%20CHANGE_ME"
# admin_otlp_headers = "authorization=Bearer%20CHANGE_ME"

# 可选：Admin Basic Auth 登录交换凭据；两个字段必须成对提供，生产值不得提交。
# actor 是登录身份标识，不是密码。
# admin_actor = "admin"
# secret 是登录共享密钥，生产环境应使用至少 16 字节的随机值。
# admin_secret = "CHANGE_ME_TO_A_RANDOM_SECRET_OF_AT_LEAST_16_BYTES"

# 可选：装备 key 的 AES-256-GCM 数据密钥；两个字段必须同时配置。
# equipment_data_key_id 是非秘密的轮换标识。
# equipment_data_key_id = "primary-2026"
# equipment_data_key 是 32 字节材料的标准 Base64 编码，不能写入日志或审计。
# equipment_data_key = "CHANGE_ME_TO_32_BYTE_BASE64_DATA_KEY"

# 可选：MoogleMail Users 注册/换绑使用的独立 AES-256-GCM 数据密钥；不能与装备 key 混用。
# user_login_data_key_id 是非秘密的轮换标识。
# user_login_data_key_id = "user-login-primary-2026"
# user_login_data_key 是 32 字节材料的标准 Base64 编码，不能写入日志或审计。
# user_login_data_key = "CHANGE_ME_TO_32_BYTE_BASE64_DATA_KEY"

# 可选：Admin A32 外部凭据（MoogleMail/E-Hentai Cookie）的独立 AES-256-GCM 数据密钥；
# 两个字段必须同时配置，不能复用 equipment_data_key 或 user_login_data_key。
# credential_data_key_id 是非秘密的轮换标识。
# credential_data_key_id = "credential-primary-2026"
# credential_data_key 是 32 字节材料的标准 Base64 编码，不能写入日志或审计。
# credential_data_key = "CHANGE_ME_TO_32_BYTE_BASE64_DATA_KEY"

# PostgreSQL 敏感配置模板；复制到受信目录，替换占位值并设为 0600，真实值不得提交，也不得进入角色主配置、runtime、日志、审计或 DTO。
# 三角色通过 secrets_file 引用；以下根字段必须位于 [database] 之前。

# 可选：启用 cache.backend = "redis" 时必填；密码、令牌及 TLS 参数仅写入私有文件。
# redis_url = "rediss://default:CHANGE_ME@redis.example.invalid:6379/0"
# 可选：启用会话签名能力时提供。
# session_signing_key = "CHANGE_ME"
# OTLP headers 使用逗号分隔的 key=value，名称和值支持 URL 百分号编码，不得覆盖 content-type、host、traceparent 等协议字段。
# 可选：Public 启用 tracing 时使用的专属 OTLP/HTTP headers。
# public_otlp_headers = "authorization=Bearer%20CHANGE_ME"
# 可选：Admin 启用 tracing 时使用的专属 OTLP/HTTP headers。
# admin_otlp_headers = "authorization=Bearer%20CHANGE_ME"
# 可选：Worker 启用 tracing 时使用的专属 OTLP/HTTP headers。
# worker_otlp_headers = "authorization=Bearer%20CHANGE_ME"

# 可选：站点管理员身份，与 admin_secret 成对配置，不是数据库账号。
# admin_actor = "admin"
# 可选：Admin 登录共享密钥，至少 16 字节，生产使用随机值。
# admin_secret = "CHANGE_ME_TO_A_RANDOM_SECRET_OF_AT_LEAST_16_BYTES"

# 三组 AES-256-GCM 数据密钥分别独立，不能复用；每组标识与密钥必须成对配置。
# 可选：装备 key 数据密钥的非秘密轮换标识。
# equipment_data_key_id = "primary-2026"
# 可选：装备 key 数据密钥，32 字节材料的标准 Base64 编码。
# equipment_data_key = "CHANGE_ME_TO_32_BYTE_BASE64_DATA_KEY"
# 可选：用户注册/换绑登录 key 数据密钥的非秘密轮换标识。
# user_login_data_key_id = "user-login-primary-2026"
# 可选：登录 key 数据密钥，32 字节材料的标准 Base64 编码。
# user_login_data_key = "CHANGE_ME_TO_32_BYTE_BASE64_DATA_KEY"
# 可选：Admin A32 外部 Cookie 数据密钥的非秘密轮换标识。
# credential_data_key_id = "credential-primary-2026"
# 可选：外部 Cookie 数据密钥，32 字节材料的标准 Base64 编码。
# credential_data_key = "CHANGE_ME_TO_32_BYTE_BASE64_DATA_KEY"

# 必填区块：PostgreSQL 五字段连接参数。
[database]
# 必填：主机名或 IP 地址，不含协议、端口、账号或路径。
host = "127.0.0.1"
# 必填：TCP 端口，范围 1-65535，通常为 5432。
port = 5432
# 必填：数据库账号，按原文填写，不做 URL 编码。
username = "auction"
# 必填：数据库密码，特殊字符按原文填写；真实值不得提交。
password = "CHANGE_ME"
# 必填：预先创建的数据库名称，不从账号或环境变量推导。
name = "auction"

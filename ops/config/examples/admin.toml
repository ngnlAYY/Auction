# Admin API 配置示例：common_file 与 secrets_file 必填，其余字段和区块均可省略并使用解析器或 runtime 默认值。
# 本文件只保存非敏感设置，真实数据库 URL、Redis URL、Cookie 和密钥必须放在敏感 TOML。

# 必填：公共非敏感 TOML 路径；相对路径相对于本文件所在目录解析。
common_file = "common.toml"
# 必填：敏感 TOML 路径；相对路径相对于本文件所在目录解析。
secrets_file = "secrets.toml"
# 可选：Admin 非敏感 runtime TOML 路径；省略时不加载独立 runtime 文档。
runtime_config_file = "runtime/admin.toml"

# 可选区块：Admin HTTP 监听器；存在 runtime 文件时由 runtime.listener 覆盖，省略整个区块时使用 TCP 127.0.0.1:8091。
[listener]
# 可选：TCP 监听地址；TCP 模式使用 host:port，默认 127.0.0.1:8091。
address = "127.0.0.1:8091"
# 可选：Unix socket 所属用户组；TCP 模式必须为空。
group = ""
# 可选：监听模式，可填 tcp 或 Linux 上的 unix；省略时为 tcp。
mode = "tcp"
# 可选：Unix socket 运行目录；TCP 模式必须为空。
runtime_directory = ""
# 可选：直接位于 runtime_directory 下的 Unix socket 路径；TCP 模式必须为空。
socket_path = ""

# 可选区块：HTTP 安全策略；存在 runtime 文件时由 runtime.security 覆盖。
[http_security]
# 可选：是否启用 origin allowlist；启用后 allowed_origins 不能为空。
allowed_origins_enabled = true
# 可选：允许的精确 HTTP(S) origin 列表，最多 16 项。
allowed_origins = ["http://127.0.0.1:8091"]
# 可选：登录请求在限流窗口内的最大次数，默认 10。
login_rate_limit = 10
# 可选：状态变更请求在限流窗口内的最大次数，默认 60。
mutation_rate_limit = 60
# 可选：限流窗口秒数，默认 60。
rate_limit_window_seconds = 60
# 可选：是否给浏览器 Cookie 设置 Secure；生产环境应为 true。
cookie_secure = false
# 可选：普通 HTTP 请求处理超时秒数，范围 1-120，默认 15；WebSocket 路径不受该值限制。
request_timeout_seconds = 15
# 可选：允许提供 X-Forwarded-For 的规范 TCP 代理 CIDR，最多 64 项；默认不信任任何代理。
trusted_proxy_cidrs = []
# 可选：是否信任 Unix socket 上游；仅有效的 Unix listener 可设为 true。
trusted_unix_proxy = false

# 可选区块：会话过期和并发策略；存在 runtime 文件时由 runtime.session 覆盖。
[session]
# 可选：空闲过期秒数，默认沿用旧版 Admin 的 900。
idle_ttl_seconds = 900
# 可选：绝对过期秒数，默认沿用旧版 Admin 的 28800，不能小于空闲过期时间。
absolute_ttl_seconds = 28800
# 可选：单个公开用户允许的最大并发会话数，默认 5。
max_public_sessions = 5

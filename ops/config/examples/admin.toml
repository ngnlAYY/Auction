# Admin API 配置示例。
#
# 除 secrets_file 外，以下字段和区块均可省略；省略时使用解析器或 runtime 文档的默认值。
# 本文件只保存非敏感设置，真实数据库 URL、Redis URL、Cookie 和密钥必须放在敏感 TOML。

# 若提供 runtime 文件，runtime 的 listener.address 会覆盖此值。
# 可选：Admin HTTP 监听地址；省略时使用 127.0.0.1:8091。
listen_address = "127.0.0.1:8091"
# 必填：敏感 TOML 路径；相对路径相对于本文件所在目录解析。
secrets_file = "secrets.toml"
# 可选：Admin 非敏感 runtime TOML 路径；省略时不加载独立 runtime 文档。
runtime_config_file = "runtime/admin.toml"
# 可选：tracing 过滤器；省略时使用进程默认过滤器。
log_filter = "info,auction=debug"

# 可选区块：进程本地 Prometheus 指标；省略整个区块等同于关闭 `/metrics`。
[metrics]
# 可选：是否启用固定 `/metrics` scrape endpoint；省略时关闭。
enabled = false

# 可选区块：缓存设置；省略整个区块等同于关闭缓存。
[cache]
# 可选：缓存后端，可填 disabled 或 redis；省略时为 disabled。
backend = "disabled"

# 可选区块：HTTP 安全策略；存在 runtime 文件时由 runtime.security 覆盖。
[http_security]
# 可选：是否启用 origin allowlist；启用后 allowed_origins 不能为空。
allowed_origins_enabled = true
# 可选：允许的精确 HTTP(S) origin 列表，最多 16 项。
allowed_origins = ["http://127.0.0.1:8091"]
# 可选：登录请求在限流窗口内的最大次数，默认 10。
login_rate_limit = 10
# 可选：状态变更请求在限流窗口内的最大次数，默认 60。
mutation_rate_limit = 60
# 可选：限流窗口秒数，默认 60。
rate_limit_window_seconds = 60
# 可选：是否给浏览器 Cookie 设置 Secure；生产环境应为 true。
cookie_secure = false

# 可选区块：会话过期和并发策略；存在 runtime 文件时由 runtime.session 覆盖。
[session]
# 可选：空闲过期秒数，默认 1800。
idle_ttl_seconds = 1800
# 可选：绝对过期秒数，默认 604800，不能小于空闲过期时间。
absolute_ttl_seconds = 604800
# 可选：单个公开用户允许的最大并发会话数，默认 5。
max_public_sessions = 5

# 可选区块：创建拍卖时冻结的经济、结算和恢复策略；省略时沿用旧版共享配置默认值。
[auction.economics]
# 可选：默认起始价，必须为正且按 1000 信用网格对齐，默认 1000。
start_price = 1000
# 可选：经济策略百万分比增量，范围 0-1000000，默认 50000。
bid_increment_ppm = 50000
# 可选：软截止窗口秒数，默认 60。
soft_close_window_seconds = 60
# 可选：命中软截止窗口后的延长秒数，默认 60。
soft_close_extension_seconds = 60
# 可选：取消截止窗口秒数，默认 86400。
cancel_cutoff_seconds = 86400
# 可选：是否启用代理竞价，默认 true。
proxy_enabled = true
# 可选：新代理授权的默认模式，只能为 fast 或 slow，默认 fast。
proxy_default_mode = "fast"
# 可选：slow 代理尝试间隔秒数，默认 600。
proxy_slow_interval_seconds = 600
# 可选：单个代理授权允许的 outbid 使用次数，默认 3；0 表示不限制。
proxy_max_outbid_uses = 3
# 可选：进入 final phase 前的领先秒数，范围 1-604800，默认 60。
final_phase_lead_seconds = 60

[auction.settlement]
# 可选：结算策略版本，当前支持 0 或 1，默认 1。
version = 1
# 可选：结算模式，只能为 hold_curve_v1 或 legacy_zero_v0，默认 hold_curve_v1。
mode = "hold_curve_v1"
# 可选：是否启用补偿池，默认 true。
compensation_pool_enabled = true
# 可选：isekai carrier credit 数量；当前领域策略要求为 1。
isekai_carrier_credit = 1
# 可选：持有比例与调整比例的 PPM 锚点数组；省略时使用内置曲线。
# 每个数组元素一旦提供，hold_ppm 与 adjustment_ppm 均为必填字段。
anchors = [
  { hold_ppm = 0, adjustment_ppm = 80000 },
  { hold_ppm = 50000, adjustment_ppm = 64000 },
  { hold_ppm = 100000, adjustment_ppm = 48000 },
  { hold_ppm = 150000, adjustment_ppm = 32000 },
  { hold_ppm = 200000, adjustment_ppm = 16000 },
  { hold_ppm = 250000, adjustment_ppm = 0 },
  { hold_ppm = 300000, adjustment_ppm = -4000 },
  { hold_ppm = 400000, adjustment_ppm = -12000 },
  { hold_ppm = 500000, adjustment_ppm = -20000 },
  { hold_ppm = 1000000, adjustment_ppm = -20000 },
]

[auction.settlement.recovery]
# 可选：恢复策略版本，当前只支持 1。
version = 1
# 可选：恢复模式，当前只支持 remind_v1。
mode = "remind_v1"
# 可选：付款超时秒数，默认七天（604800 秒）。
payment_timeout_seconds = 604800
# 可选：付款超时提醒次数，当前默认且只支持 1。
reminder_limit = 1

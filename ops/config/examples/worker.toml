# Worker 配置示例。
#
# 除 secrets_file 外，以下字段和区块均可省略；省略时使用解析器提供的默认值。
# SQLite Lite 档会强制 Worker 并发为 1。

# 必填：敏感 TOML 路径；相对路径相对于本文件所在目录解析。
secrets_file = "secrets.toml"
# 可选：tracing 过滤器；省略时使用进程默认过滤器。
log_filter = "info,auction=debug"

# 可选区块：缓存设置；省略整个区块等同于关闭缓存。
[cache]
# 可选：缓存后端，可填 disabled 或 redis；省略时为 disabled。
backend = "disabled"

# 可选区块：Worker 调度策略；省略整个区块时并发默认为 1、轮询间隔默认为 5 秒。
[worker]
# 可选：Worker 并发数；必须大于 0，SQLite Lite 必须为 1。
concurrency = 1
# 可选：due 任务轮询间隔秒数；必须大于 0，默认 5。
poll_interval_seconds = 5

# 可选区块：MoogleMail 入站轮询；默认关闭。启用后只在 PostgreSQL 完整档发送远程 GET。
[worker.mooglemail]
# 可选：是否启用 MoogleMail Worker；默认 false，避免配置不完整时触发外部请求。
enabled = false
# 可选：持久化邮箱标识；默认 mooglemail:main。
mailbox_key = "mooglemail:main"
# 可选：游戏世界，只能是 main 或 isekai；默认 main。
world_id = "main"
# 可选：`.keyenv` 路径；相对本文件解析。启用时与敏感 mooglemail_cookie 二选一。
keyenv_file = "../../../.keyenv"
# 可选：单次读取上限，范围 1-1000，默认 100。
batch_size = 100
# 可选：单次有界读取的最大页数，范围 1-100，默认 20。
maximum_pages = 20
# 可选：发件人 allowlist；留空且不关闭 allowlist 时不会读取任何详情。
sender_allowlist = []
# 可选：明确设为 true 才读取所有发件人详情；生产环境应保持 false。
sender_allowlist_disabled = false

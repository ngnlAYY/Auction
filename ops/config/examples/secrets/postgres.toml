# PostgreSQL 完整档敏感配置模板；复制到受信目录并替换占位凭据，文件权限设为 0600。
# 三个角色通过 secrets_file 引用敏感文件，数据库参数只在本文件中配置。

# 可选：Admin 登录账号，与 admin_secret 成对配置；这是站点管理员，不是数据库账号。
# admin_actor = "admin"
# 可选：Admin 登录密码，至少 16 字节；真实值不得提交。
# admin_secret = "CHANGE_ME_TO_A_RANDOM_SECRET_OF_AT_LEAST_16_BYTES"

# 必填区块：PostgreSQL 连接参数；与旧 database_url 写法不能同时出现。
[database]
# 必填：主机名或 IP 地址，不包含协议、端口、账号或路径。
host = "127.0.0.1"
# 必填：PostgreSQL TCP 端口，范围 1-65535，通常为 5432。
port = 5432
# 必填：数据库登录账号，按原文填写，不做 URL 编码。
username = "auction"
# 必填：数据库登录密码，特殊字符按原文填写；真实值不得提交。
password = "CHANGE_ME"
# 必填：预先创建的数据库名称，不从账号或环境变量推导。
name = "auction"

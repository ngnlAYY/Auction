# PostgreSQL 建库/重建维护凭据模板；可选，生产推荐独立挂载，真实值不得提交，仅 CLI --maintenance-secrets-file 使用，常驻角色不得引用。
# 路径须规范化绝对、无符号链接，父目录不可被 group/other 写入；文件归命令用户所有，只有一个 hard link 且 owner-only（建议 0600）。
# endpoint、端口和 TLS profile 须与对应应用配置一致，可用独立维护账号；重建账号须为 superuser，或为目标数据库 owner 且拥有 CREATEDB，其余门禁见恢复手册。
# 必填区块：维护库五字段；name 固定为 postgres。
[database]
# 必填：维护库主机名或 IP。
host = "db.example.invalid"
# 必填：维护库 TCP 端口，通常 5432。
port = 5432
# 必填：高权限维护账号。
username = "auction_maintenance"
# 必填：维护账号密码，真实值不得提交。
password = "CHANGE_ME"
# 必填：固定为 postgres 维护库。
name = "postgres"

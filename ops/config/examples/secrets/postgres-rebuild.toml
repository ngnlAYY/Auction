# PostgreSQL 破坏性重建专用敏感配置模板；该文件本身是可选的，生产环境推荐单独挂载。
# 真实文件必须使用规范化绝对路径、不得是符号链接、父目录不可被共享写入，并归命令用户所有、
# 只有一个 hard link、限制为 owner-only（建议 chmod 600）。
# 本文件只能被 `auctionctl postgres-rebuild --maintenance-secrets-file` 短暂读取，不能由
# Public、Admin、Worker 常驻进程引用，也不能把真实 URL 提交到版本库。

# endpoint、端口和 TLS profile 必须与 Worker database_url 相同；用户名/密码可以是独立维护角色。
# 维护角色必须是 superuser，或是目标数据库 owner 且拥有 CREATEDB。
# 可改用 [database] 的 host、port、username、password、name 五项并删除 database_url，name 填 postgres；
# 需要下方显式 TLS 策略时保留 URL 写法，不能同时提供两种形式。
# 必填：高权限维护 URL，数据库路径固定为 /postgres。
database_url = "postgresql://auction_maintenance:CHANGE_ME@db.example.invalid:5432/postgres?sslmode=verify-full"

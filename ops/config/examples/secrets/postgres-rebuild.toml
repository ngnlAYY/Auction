# PostgreSQL 建库/重建维护凭据模板；可选，生产推荐独立挂载，真实值不得提交，仅 auction-cli 的 --maintenance-secrets 参数使用（db create、db rebuild），常驻角色不得引用。
# 路径须规范化绝对、无符号链接，父目录不可被 group/other 写入；文件归命令用户所有，只有一个 hard link 且 owner-only（建议 0600）。
# endpoint 与端口须与对应应用配置一致；TLS 参数（sslmode、sslrootcert 等）只能通过顶层 database_url 的查询参数指定（与 [database] 五字段二选一），且须与应用配置一致。
# 必填区块：维护库五字段；name 固定为 postgres。
[database]
# 必填：维护库主机名或 IP。
host = "db.example.invalid"
# 必填：维护库 TCP 端口，通常 5432。
port = 5432
# 必填：高权限维护账号。
username = "auction_maintenance"
# 必填：维护账号密码，真实值不得提交。
password = "CHANGE_ME"
# 必填：固定为 postgres 维护库。
name = "postgres"

# PostgreSQL 迁移 owner 凭据模板；迁移 081 起服务运行账号（auction_runtime）没有 DDL 权限，
# 建库、迁移、重建与恢复必须使用这里的 owner 账号。真实值不得提交。
# 只由 auction-cli 的 --owner-secrets 参数使用（db create、db migrate、db rebuild、backup restore、
# service start/restart），常驻角色（Public/Admin/Worker）不得引用，secrets_file 也不能指向它。
# 路径须规范化为绝对路径、无符号链接，父目录不可被 group/other 写入；文件归命令用户所有，
# 只有一个 hard link 且 owner-only（建议 0600）。
# 账号须是应用数据库 owner，且不能与服务账号或维护账号（postgres 库）共用。
# 必填区块：应用数据库五字段；name 必须与三角色 [database].name 一致。
[database]
# 必填：应用数据库主机名或 IP。
host = "db.example.invalid"
# 必填：应用数据库 TCP 端口，通常为 5432。
port = 5432
# 必填：迁移 owner 账号；须与 common.toml 的 [database_roles] owner 一致。
username = "auction_owner"
# 必填：迁移 owner 密码，真实值不得提交。
password = "CHANGE_ME"
# 必填：应用数据库名称，与三角色配置一致。
name = "auction"

# Public API 配置示例。
#
# 除 secrets_file 外，以下字段和区块均可省略；省略时使用解析器提供的默认值。
# 本文件只保存非敏感设置，真实数据库 URL、Redis URL、Cookie 和密钥必须放在敏感 TOML。

# 必填：敏感 TOML 路径；相对路径相对于本文件所在目录解析。
secrets_file = "secrets.toml"
# 可选：tracing 过滤器；省略时使用进程默认过滤器。
log_filter = "info,auction=debug"

# 可选区块：Public HTTP 监听器；省略整个区块时使用 TCP 127.0.0.1:8090。
[listener]
# 可选：TCP 监听地址；TCP 模式使用 host:port，默认 127.0.0.1:8090。
address = "127.0.0.1:8090"
# 可选：Unix socket 所属用户组；TCP 模式必须为空。
group = ""
# 可选：监听模式，可填 tcp 或 Linux 上的 unix；省略时为 tcp。
mode = "tcp"
# 可选：Unix socket 运行目录；TCP 模式必须为空。
runtime_directory = ""
# 可选：直接位于 runtime_directory 下的 Unix socket 路径；TCP 模式必须为空。
socket_path = ""

# 可选区块：进程本地 Prometheus 指标；省略整个区块等同于关闭 `/metrics`。
[metrics]
# 可选：是否启用固定 `/metrics` scrape endpoint；省略时关闭。
enabled = false

# 可选区块：Public OTLP/HTTP tracing；省略整个区块等同于关闭导出。
[tracing]
# 可选：是否启用 OTLP/HTTP span 导出；启用时必须同时提供 endpoint 和非零采样比例。
enabled = false
# 可选：collector 地址，例如 https://otel-collector.example.invalid/v1/traces。
# endpoint = "https://otel-collector.example.invalid/v1/traces"
# 可选：批次等待秒数，范围 1-30，默认 2。
batch_timeout_seconds = 2
# 可选：单次导出超时秒数，范围 1-30，默认 5。
export_timeout_seconds = 5
# 可选：关闭时等待 exporter 刷新的秒数，范围 1-30，默认 5。
shutdown_timeout_seconds = 5
# 可选：单批最大 span 数，不能超过 queue_capacity，范围 1-512。
max_export_batch_size = 64
# 可选：有界导出队列容量，范围 1-4096。
queue_capacity = 256
# 可选：采样比例百万分率；启用时范围 1-1000000，关闭时默认为 0。
sample_ratio_ppm = 0

# 可选区块：Public realtime relay 与进程内 WebSocket Hub；省略整个区块使用默认值。
[realtime]
# 可选：当前 Public 实例的持久化 consumer 标识；多 Public 实例必须各不相同。
consumer_key = "public-1"
# 可选：relay 两次扫描之间的毫秒数，默认 250。
poll_interval_millis = 250
# 可选：单轮最多扫描的 stream 数，默认 200。
stream_batch_size = 200
# 可选：单个 stream 单轮最多转发的事件数，默认 200。
event_batch_size = 200
# 可选：每个 WebSocket 连接的进程内缓冲数，默认 32；慢连接满载后会被淘汰。
client_buffer = 32

# 可选区块：缓存设置；省略整个区块等同于关闭缓存。
[cache]
# 可选：缓存后端，可填 disabled 或 redis；省略时为 disabled。
backend = "disabled"
# 可选：Public 规则读模型缓存 TTL 秒数，范围 1-3600，默认 30；缓存关闭时仍会校验该字段。
public_rules_ttl_seconds = 30

# 可选区块：HTTP 安全策略；省略整个区块时使用内置默认值。
[http_security]
# 可选：是否启用 origin allowlist；启用后 allowed_origins 不能为空。
allowed_origins_enabled = true
# 可选：允许的精确 HTTP(S) origin 列表，最多 16 项。
allowed_origins = ["http://127.0.0.1:8090"]
# 可选：登录请求在限流窗口内的最大次数，默认 10。
login_rate_limit = 10
# 可选：状态变更请求的最大次数；realtime 连接尝试使用相同上限但独立计数，默认 60。
mutation_rate_limit = 60
# 可选：限流窗口秒数，默认 60。
rate_limit_window_seconds = 60
# 可选：是否给浏览器 Cookie 设置 Secure；生产环境应为 true。
cookie_secure = false
# 可选：普通 HTTP 请求处理超时秒数，范围 1-120，默认 15；WebSocket 路径不受该值限制。
request_timeout_seconds = 15
# 可选：允许提供 X-Forwarded-For 的规范 TCP 代理 CIDR，最多 64 项；默认不信任任何代理。
trusted_proxy_cidrs = []
# 可选：是否信任 Unix socket 上游提供的 X-Forwarded-For；仅 listener.mode = unix 时可设为 true。
trusted_unix_proxy = false

# 可选区块：会话过期和并发策略；省略整个区块时使用默认值。
[session]
# 可选：空闲过期秒数，默认 1800。
idle_ttl_seconds = 1800
# 可选：绝对过期秒数，默认 604800，不能小于空闲过期时间。
absolute_ttl_seconds = 604800
# 可选：单个公开用户允许的最大并发会话数，默认 5。
max_public_sessions = 5

# 可选区块：创建拍卖时冻结的经济、结算和恢复策略；省略时沿用旧版共享配置默认值。
[auction.economics]
# 可选：默认起始价，必须为正且按 1000 信用网格对齐，默认 1000。
start_price = 1000
# 可选：经济策略百万分比增量，范围 0-1000000，默认 50000。
bid_increment_ppm = 50000
# 可选：软截止窗口秒数，默认 60。
soft_close_window_seconds = 60
# 可选：命中软截止窗口后的延长秒数，默认 60。
soft_close_extension_seconds = 60
# 可选：取消截止窗口秒数，默认 86400。
cancel_cutoff_seconds = 86400
# 可选：是否启用代理竞价，默认 true。
proxy_enabled = true
# 可选：新代理授权的默认模式，只能为 fast 或 slow，默认 fast。
proxy_default_mode = "fast"
# 可选：slow 代理尝试间隔秒数，默认 600。
proxy_slow_interval_seconds = 600
# 可选：单个代理授权允许的 outbid 使用次数，默认 3；0 表示不限制。
proxy_max_outbid_uses = 3
# 可选：进入 final phase 前的领先秒数，范围 1-604800，默认 60。
final_phase_lead_seconds = 60

[auction.settlement]
# 可选：结算策略版本，当前支持 0 或 1，默认 1。
version = 1
# 可选：结算模式，只能为 hold_curve_v1 或 legacy_zero_v0，默认 hold_curve_v1。
mode = "hold_curve_v1"
# 可选：是否启用补偿池，默认 true。
compensation_pool_enabled = true
# 可选：isekai carrier credit 数量；当前领域策略要求为 1。
isekai_carrier_credit = 1
# 可选：持有比例与调整比例的 PPM 锚点数组；省略时使用内置曲线。
# 每个数组元素一旦提供，hold_ppm 与 adjustment_ppm 均为必填字段。
anchors = [
  { hold_ppm = 0, adjustment_ppm = 80000 },
  { hold_ppm = 50000, adjustment_ppm = 64000 },
  { hold_ppm = 100000, adjustment_ppm = 48000 },
  { hold_ppm = 150000, adjustment_ppm = 32000 },
  { hold_ppm = 200000, adjustment_ppm = 16000 },
  { hold_ppm = 250000, adjustment_ppm = 0 },
  { hold_ppm = 300000, adjustment_ppm = -4000 },
  { hold_ppm = 400000, adjustment_ppm = -12000 },
  { hold_ppm = 500000, adjustment_ppm = -20000 },
  { hold_ppm = 1000000, adjustment_ppm = -20000 },
]

[auction.settlement.recovery]
# 可选：恢复策略版本，当前只支持 1。
version = 1
# 可选：恢复模式，当前只支持 remind_v1。
mode = "remind_v1"
# 可选：付款超时秒数，默认七天（604800 秒）。
payment_timeout_seconds = 604800
# 可选：付款超时提醒次数，当前默认且只支持 1。
reminder_limit = 1

# 三角色共同引用的非敏感配置示例；拥有跨角色策略与 CLI 专用备份策略，其余字段归角色文件或敏感文件。

# 可选：tracing 过滤器；省略时使用进程默认过滤器。
log_filter = "info,auction=debug"

# 可选区块：进程本地 Prometheus 指标；Admin runtime 仅在重启时覆盖 Admin 的 enabled。
[metrics]
# 可选：是否启用固定指标端点；省略时关闭。
enabled = false
# 可选：默认 true，拒绝业务指标路由及三角色附加出口的转发请求；修改需重启。
reject_forwarded_requests = true
# 可选：省略关闭，enabled 为 true 才监听；只接受 127.0.0.1 与非零端口。
# public_loopback_listen_address = "127.0.0.1:19100"
# 可选：省略关闭；Admin runtime 只覆盖 enabled，不覆盖此地址或转发拒绝策略。
# admin_loopback_listen_address = "127.0.0.1:19101"
# 可选：省略关闭；独立于 Worker control，不需要扩展 peer UID/GID allowlist。
# worker_loopback_listen_address = "127.0.0.1:19102"

# 可选区块：三角色共用的 TOML 就绪基线；修改文件须重启，审计/缓存行为可由数据库运行时开关覆盖；不由 Admin runtime 覆盖。
[readiness]
# 可选：legacy、shadow 或 classified，默认 shadow；运行时 readiness_audit_failure_mode 未设置、clear 或过期时使用此基线，切 classified 由用户决定。
audit_failure_mode = "shadow"
# 可选：strict、shadow 或 compatible，默认 shadow；换回支持兼容判定的旧程序前须显式设为 compatible，修改需重启。
migration_compatibility_mode = "shadow"
# 可选：默认 true；运行时 readiness_cache_enabled 未设置、clear 或过期时使用此基线；HTTP 就绪缓存 1 秒，false 回到逐次探测。
cache_enabled = true

# 可选区块：可丢弃缓存设置；省略整个区块等同于关闭缓存。
[cache]
# 可选：缓存后端，可填 disabled 或 redis；省略时为 disabled。
backend = "disabled"
# 可选：Public 规则读模型缓存 TTL 秒数，范围 1-3600，默认 30。
public_rules_ttl_seconds = 30

# 可选区块：仅由 CLI 的 backup scheduled 消费；省略时取以下默认值，启停由 systemd timer 控制。
[backup]
# 可选：本地保留最近多少份已完成定时备份，默认 7，范围 1–365；不清理手动备份。
local_retention_count = 7
# 可选：备份文件系统至少剩余的可用字节，默认 1 GiB，范围 64 MiB–1 TiB；不足时失败关闭。
min_free_bytes = 1073741824
# 可选：备份文件系统至少剩余的可用百分比，默认 10，范围 1–50；与字节阈值同时满足。
min_free_percent = 10
# 可选：本次备份的总预算秒数，默认 7200，范围 60–7200；到期写失败回执，不执行保留点腾挪。
timeout_seconds = 7200

# 可选区块：异机副本仅由 backup scheduled 消费；启用前须安装 age、托管私钥并配置 R2 bucket lock。
[backup.offsite]
# 可选：默认 false；设为 true 后以下四个字段和 Worker 敏感文件中的成对 R2 凭据必填，下一次运行生效。
enabled = false
# 可选：默认空，启用时必填；离线生成的 age1 开头 X25519 公钥，服务器不保存私钥或口令。
age_recipient = ""
# 可选：默认空，启用时必填；R2 S3 API HTTPS 根地址，不含 userinfo、查询或 fragment。
endpoint = ""
# 可选：默认空，启用时必填；预先建立且已配置生命周期与 bucket lock 的 bucket 名。
bucket = ""
# 可选：默认空，启用时必填；例如 auction，无首尾斜杠、空段或点段；daily/monthly 由工具追加。
prefix = ""

# 可选区块：每周自动建立拍卖的时间表；省略时使用同样时间但保持关闭。
[auction.schedule]
# 可选：是否启用 Worker 周计划，默认 false。
enabled = false
# 可选：计划使用的 IANA 时区，默认 UTC。
timezone = "UTC"
# 可选：开放预览的星期，默认 Thursday。
preview_day = "Thursday"
# 可选：开放预览的本地时间，默认 22:00（距正式开拍两小时）。
preview_time = "22:00"
# 可选：正式开拍的星期，默认 Friday。
open_day = "Friday"
# 可选：正式开拍的本地时间，默认 00:00。
open_time = "00:00"
# 可选：计划结束的星期，默认 Saturday。
nominal_end_day = "Saturday"
# 可选：计划结束的本地时间，默认 12:00。
nominal_end_time = "12:00"
# 可选：参与周计划的 world，默认 main 和 isekai。
worlds = ["main", "isekai"]

# 可选区块：赛季早鸟期；仅在 [auction.schedule] 启用时生效，窗口内由早鸟场次替代重叠的常规周场。
[auction.schedule.early_bird]
# 可选：是否启用早鸟期，默认 false；启用时 auction.schedule.enabled 必须为 true。
enabled = false
# 可选：赛季开始与场次钟点使用的 IANA 时区，默认 UTC。
timezone = "UTC"
# 可选：参与早鸟期的 world，须包含在 auction.schedule.worlds 中，默认 ["isekai"]。
worlds = ["isekai"]
# 可选：每年赛季开始的月-日（MM-DD），1-12 项且不接受 02-29，默认 ["05-01", "11-01"]。
season_starts = ["05-01", "11-01"]
# 可选：赛季开始的本地钟点（HH:MM），早鸟窗口与收件品质从此刻起算，默认 09:00。
season_start_time = "09:00"
# 可选：早鸟窗口天数，范围 1-31，默认 7。
window_days = 7
# 可选：窗口内开拍的第几天，从 1 起严格递增且不超过 window_days，默认 [1, 3, 5, 7]。
session_days = [1, 3, 5, 7]
# 可选：每个开拍日的本地开拍钟点（HH:MM），默认 18:00；首场预览不得早于赛季开始。
open_time = "18:00"
# 可选：预览早于开拍的分钟数，范围 120-10080，默认 120。
preview_lead_minutes = 120
# 可选：开拍到计划结束的分钟数，范围 1-10080，默认 1440；下一场预览不得早于上一场计划结束。
live_minutes = 1440
# 可选：是否在赛季开始日前安排赛季前场次，默认 true；isekai 在赛季开始日关服换季，该场是旧赛季关服前的最后一场，与之重叠的常规周场由它替代。
pre_season_session = true
# 可选：赛季前场次在赛季开始日前第几天开拍，范围 1-31，默认 3（即 D-3 18:00 开拍、D-2 18:00 结束）；开拍钟点、预览提前量与竞价时长沿用上方三项。该场付款期限为 24 小时，计划结束后 24 小时须早于赛季开始日本地 00:00。
pre_season_days_before = 3
# 可选：窗口内收到的投稿接受的品质；空数组表示不限品质，默认 []。
qualities = []
# 可选：首场早鸟草稿建立后至赛季开始前是否暂停该 world 收件轮询，默认 true。
pause_intake_before_season = true

# 可选区块：创建拍卖时冻结的经济、结算和恢复策略；省略时使用内置默认值。
[auction.economics]
# 可选：默认起始价，必须为正且按 1000 Credits 网格对齐，默认 1000。
start_price = 1000
# 可选：经济策略百万分比增量，范围 0-1000000，默认 50000。
bid_increment_ppm = 50000
# 可选：软截止窗口秒数，默认 900（固定15分钟）。
soft_close_window_seconds = 900
# 可选：候选截止为出价接受时刻加本秒数，默认 900，仅允许向后延长。
soft_close_extension_seconds = 900
# 可选：取消截止窗口秒数，默认 86400；仅随策略冻结，当前取消只允许开拍前。
cancel_cutoff_seconds = 86400
# 可选：是否启用代理竞价，默认 true。
proxy_enabled = true
# 可选：新代理授权的默认模式，只能为 fast 或 slow，默认 fast。
proxy_default_mode = "fast"
# 可选：slow 代理尝试间隔秒数，默认 600。
proxy_slow_interval_seconds = 600
# 可选：同一用户在同一 lot 可设置代理授权的次数（代理被超越后可重新设置），默认 3；0 表示不限制。
proxy_max_outbid_uses = 3
# 可选：进入 final phase 前的领先秒数，范围 1-604800，默认 900（15 分钟）。
final_phase_lead_seconds = 900

# 可选区块：新拍卖的结算版本、模式、补偿池和领先时长曲线；创建拍卖时冻结，已有场次不随修改变化。
[auction.settlement]
# 可选：新拍卖结算策略版本，支持 0 或 2，默认 2；旧版本 1 仅供冻结场次读取。
version = 2
# 可选：新拍卖使用 hold_curve_v2（卖方全额）或 legacy_zero_v0，默认 hold_curve_v2。
mode = "hold_curve_v2"
# 可选：补偿池开关；hold_curve_v2 必须为 true，legacy_zero_v0 必须为 false，默认 true。
compensation_pool_enabled = true
# 可选：isekai carrier credit 数量；当前领域策略要求为 1。
isekai_carrier_credit = 1
# 可选：PPM 锚点数组，省略时使用内置曲线；每个元素的 hold_ppm 与 adjustment_ppm 均必填。
anchors = [
  { hold_ppm = 0, adjustment_ppm = 80000 },
  { hold_ppm = 50000, adjustment_ppm = 64000 },
  { hold_ppm = 100000, adjustment_ppm = 48000 },
  { hold_ppm = 150000, adjustment_ppm = 32000 },
  { hold_ppm = 200000, adjustment_ppm = 16000 },
  { hold_ppm = 250000, adjustment_ppm = 0 },
  { hold_ppm = 300000, adjustment_ppm = -4000 },
  { hold_ppm = 400000, adjustment_ppm = -12000 },
  { hold_ppm = 500000, adjustment_ppm = -20000 },
  { hold_ppm = 1000000, adjustment_ppm = -20000 },
]

# 可选区块：结算后付款超时、提醒与 COD 退回的恢复策略；创建拍卖时冻结，省略时使用内置默认值。
[auction.settlement.recovery]
# 可选：恢复策略版本，默认 1（七天付款期限）；2 为 24 小时付款期限，赛季前场次自动使用 2。
version = 1
# 可选：恢复模式，当前只支持 remind_v1。
mode = "remind_v1"
# 可选：付款超时秒数，须与版本对应：版本 1 为 604800（默认），版本 2 为 86400。
payment_timeout_seconds = 604800
# 可选：付款超时提醒次数，当前默认且只支持 1。
reminder_limit = 1
# 可选：同一笔 COD 允许的退回次数，范围 1-10，默认 3；达到上限后装备退回卖家并拉黑买家。
cod_return_limit = 3

# 可选区块：连接分档；以下修改均需重启，受停机门禁约束。
[database_profiles]
# 可选：默认 profiled；legacy 完整恢复旧连接参数，修改需重启。
mode = "profiled"

# 可选区块：CLI 维护池；不套用服务短超时，保留 owner 局部限界。
[database_profiles.maintenance]
# 可选：物理上限默认 4；独立 guard、libpq 会话另计，修改需重启。
max_connections = 4
# 可选：获取池连接时限，默认 30000ms，范围 1-120000，修改需重启。
acquire_timeout_millis = 30000

# 可选区块：部署规划声明；工具不连接数据库验证 reserve。
[database_profiles.budget]
# 可选：声明 PostgreSQL 连接总上限，默认 100；修改需重启。
max_connections = 100
# 可选：声明 superuser 预留，默认 3，待用户核实线上；修改需重启。
superuser_reserved_connections = 3
# 可选：声明其他预留，默认 0，待用户核实线上；修改需重启。
reserved_connections = 0
# 可选：预算并行 CLI 数，默认 2；不强制调度，修改需重启。
max_concurrent_cli = 2
# 可选：专用直连、备份、exporter、人工预留默认 8；修改需重启。
external_reserved_connections = 8

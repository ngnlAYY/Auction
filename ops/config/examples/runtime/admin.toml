# Admin runtime 非敏感配置示例。
#
# runtime 文件的字段都支持省略；旧字段使用应用模型默认值，operations 各组默认沿用部署配置。
# 本文件不能放 [database]、database_url、redis_url、Cookie、密码、签名密钥或装备数据密钥。
# 生产部署请将文件置于受信任目录并设置为 0640，修改后需要重启受影响的 Admin/Worker 才会生效。

# 可选：是否允许人工提前开放拍卖；省略时为 false。
allow_manual_early_open = false
# 可选：是否允许 Admin 提前结束竞价并进入结算队列；默认 false，修改后需重启。
allow_manual_early_settlement = false

# 可选区块：主世界 MoogleMail 入站策略；与 isekai、equipment_filter、mail_templates 同时省略时兼容升级前文档。
[worlds.main]
# 可选：是否由 Worker 处理主世界；两个 world 至少启用一个，默认 true。
enabled = true
# 可选：允许读取详情的发件人身份；空数组且未关闭 allowlist 时不读取任何详情。
sender_allowlist = []
# 可选：明确设为 true 才读取任意发件人的详情；默认 false。
sender_allowlist_disabled = false

# 可选区块：异世界 MoogleMail 入站策略；默认启用并使用独立 durable mailbox。
[worlds.isekai]
# 可选：是否由 Worker 处理异世界；两个 world 至少启用一个，默认 true。
enabled = true
# 可选：允许读取详情的发件人身份；空数组且未关闭 allowlist 时不读取任何详情。
sender_allowlist = []
# 可选：明确设为 true 才读取任意发件人的详情；默认 false。
sender_allowlist_disabled = false

# 可选区块：拍卖邮件装备过滤；默认关闭，来源仍必须标记为可交易。
[equipment_filter]
# 可选：是否启用品质、前后缀、分类、类型和等级过滤；默认 false。
enabled = false
# 可选：允许的品质 token；空数组表示不限制。
qualities = []
# 可选：允许的前缀 token；空数组表示不限制。
prefixes = []
# 可选：允许的后缀 token；空数组表示不限制。
suffixes = []
# 可选：允许的装备分类 token；空数组表示不限制。
categories = []
# 可选：允许的装备类型 token；空数组表示不限制。
equipment_types = []

# 可选区块：装备等级范围；0 表示不启用对应边界。
[equipment_filter.level]
# 可选：最低装备等级，范围 0-1000，默认 0。
min = 0
# 可选：最高装备等级，范围 0-1000 且不小于 min，默认 0。
max = 0

# 可选区块：MoogleMail 业务通知模板；字段闭集和默认正文由本模板冻结。
[mail_templates]
# 可选：拍卖邮件包含资产时的拒绝正文。
auction_assets_rejected = "Auction assets rejected"
# 可选：拍卖邮件没有附件时的拒绝正文。
auction_no_attachments = "Auction has no attachments"
# 可选：装备不符合条件时的拒绝正文；支持 {reason_code}。
auction_equipment_rejected = "Auction equipment rejected: {reason_code}"
# 可选：用户邮件包含拍卖资产时的拒绝正文。
user_assets_rejected = "User assets rejected"
# 可选：注册成功或恢复成功时发送 key；支持且要求 {login_key}、{username}。
register_key = "Registration key {login_key} for {username}"
# 可选：注册结果通知；要求 {result_code}，并支持 {username}。
register_result = "Registration result {result_code} {username}"
# 可选：重绑结果通知；要求 {result_code}，并支持 {username}。
rebind_result = "Rebind result {result_code} {username}"
# 可选：主世界竞得装备的货到付款通知；要求 {item_name}、{amount}、{reference}。
settlement_winner_equipment_cod = "Auction item {item_name}; COD {amount}; reference {reference}"
# 可选：异世界付款载体通知；要求 {amount}、{reference}。
settlement_payment_carrier = "Auction payment request {amount}; reference {reference}"
# 可选：结算付款超时提醒；要求 {reference}。
settlement_payment_reminder = "Auction payment is overdue; reference {reference}"
# 可选：装备交付或退回通知；要求 {item_name}、{reference}。
settlement_equipment_handoff = "Auction item {item_name}; reference {reference}"
# 可选：卖家收款通知；要求 {amount}、{reference}。
settlement_seller_payout = "Auction seller payout {amount}; reference {reference}"
# 可选：买家退款通知；要求 {amount}、{reference}。
settlement_buyer_refund = "Auction buyer refund {amount}; reference {reference}"
# 可选：运维告警通知；要求 {summary}。
operations_alert = "Operations alert: {summary}"

# 可选：Admin dashboard 需要核对的 MoogleMail world/mailbox 范围；省略时不强制检查范围。
# 该清单应与 Worker 配置中的 world_id/mailbox_key 一致，只包含非敏感标识。
[[dashboard_mailboxes]]
# 可选：需要核对的游戏世界，只能是 main 或 isekai。
world_id = "main"
# 可选：Worker 为该世界使用的持久化邮箱标识。
mailbox_key = "mooglemail:main"

[[dashboard_mailboxes]]
# 可选：需要核对的游戏世界，只能是 main 或 isekai。
world_id = "isekai"
# 可选：Worker 为该世界使用的持久化邮箱标识。
mailbox_key = "mooglemail:isekai"

# 可选区块：装备来源和远程读取边界；省略整个区块时使用默认限制。
[equipment_source]
# 可选：允许访问的远程主机名；默认只允许 Hentaiverse 生产主机。
allowed_hosts = ["hentaiverse.org"]
# 可选：允许访问的 URL 路径前缀；默认只允许两个游戏世界的装备目录。
allowed_path_prefixes = ["/equip/", "/isekai/equip/"]
# 可选：是否启用主机和路径双重 allowlist；省略时开启。
allowlist_enabled = true
# 可选：是否只允许可交易装备；省略时关闭，关闭后 Soulbound 装备也可由 Admin 手工录入。
require_tradeable = false
# 可选：单次响应最大字节数，范围为 64 KiB 至 8 MiB；默认 2 MiB。
maximum_response_bytes = 2097152
# 可选：两次请求之间的最小间隔毫秒数，范围为 1 至 60000；默认沿用旧版的 250。
minimum_request_interval_millis = 250
# 可选：外部请求超时秒数，范围为 1 至 30；默认 10。
request_timeout_seconds = 10

# 可选区块：Admin 监听器；省略整个区块时使用 TCP 127.0.0.1:8091。
[listener]
# 可选：TCP 监听地址；TCP 模式使用 host:port，默认 127.0.0.1:8091。
address = "127.0.0.1:8091"
# 可选：Linux Unix socket 用户组；TCP 模式不使用，默认空字符串。
group = ""
# 可选：监听模式，可填 tcp 或 unix（Unix 仅支持 Linux）；省略时为 tcp。
mode = "tcp"
# 可选：Unix socket 运行目录；TCP 模式不使用，默认 /run/hv-auction。
runtime_directory = "/run/hv-auction"
# 可选：Unix socket 路径；TCP 模式不使用，默认空字符串。
socket_path = ""

# Linux Unix 模式示例（启用时请替换上面的 listener 区块）：
# [listener]
# 可选：Unix 模式不使用 TCP 地址，必须留空。
# address = ""
# 可选：Unix socket 所属用户组；部署前必须建立。
# group = "auction"
# 可选：将监听模式切换为 unix。
# mode = "unix"
# 可选：由运行账号拥有且不可被其他用户写入的 runtime 目录。
# runtime_directory = "/run/hv-auction"
# 可选：直接位于 runtime_directory 下的 Unix socket 路径。
# socket_path = "/run/hv-auction/admin.sock"
# runtime_directory 必须预先存在，由运行账号拥有且禁止 group/other 写入。
# 全部祖先须由 root 或运行账号拥有、禁止 group/other 写入且无符号链接；root-owned sticky 祖先允许例外。

# 可选区块：metrics 设置；省略整个区块时关闭导出。
[metrics]
# 可选：是否启用 metrics 导出；省略时关闭。
enabled = false

# 可选区块：HTTP 安全策略；省略整个区块时使用默认值。
[security]
# 可选：允许的精确 HTTP(S) origin 列表；启用 allowlist 时不能为空。
allowed_origins = ["http://127.0.0.1:8091"]
# 可选：是否启用 origin allowlist；省略时开启，TCP 且列表为空时从 listener 推导。
allowed_origins_enabled = true
# 可选：登录请求在限流窗口内的最大次数，默认 10。
login_rate_limit = 10
# 可选：状态变更请求在限流窗口内的最大次数，默认 60。
mutation_rate_limit = 60
# 可选：限流窗口秒数，默认 60。
rate_limit_window_seconds = 60
# 可选：是否给浏览器 Cookie 设置 Secure；生产环境应为 true。
cookie_secure = false
# 可选：普通 HTTP 请求处理超时秒数，范围 1-120，默认 15；WebSocket 路径不受该值限制。
request_timeout_seconds = 15
# 可选：允许提供 X-Forwarded-For 的规范 TCP 代理 CIDR，最多 64 项；默认不信任任何 TCP 代理。
trusted_proxy_cidrs = []
# 可选：是否信任 Unix socket 上游提供的 X-Forwarded-For；仅 listener.mode = unix 时可设为 true。
trusted_unix_proxy = false

# 可选区块：Admin 会话策略；省略整个区块时使用默认值。
[session]
# 可选：空闲过期秒数，默认沿用旧版 Admin 的 900。
idle_ttl_seconds = 900
# 可选：绝对过期秒数，默认沿用旧版 Admin 的 28800，不能小于空闲过期时间。
absolute_ttl_seconds = 28800
# 可选：单个公开用户允许的最大并发会话数，默认 5。
max_public_sessions = 5

# 可选区块：tracing 导出参数；省略整个区块时关闭导出。
[tracing]
# 可选：导出批次等待秒数，范围为 1 至 30；默认 1。
batch_timeout_seconds = 1
# 可选：是否启用 tracing 导出；省略时关闭。
enabled = false
# 可选：导出端点；关闭 tracing 时可留空，启用时必须是 HTTP(S) URL。
endpoint = ""
# 可选：单次导出超时秒数，范围为 1 至 30；默认 5。
export_timeout_seconds = 5
# 可选：单次导出的最大 span 数，范围为 1 至 512；默认 128。
max_export_batch_size = 128
# 可选：导出队列容量，范围为 1 至 4096；默认 256。
queue_capacity = 256
# 可选：采样比例，单位为百万分率，范围为 0 至 1000000；默认 0。
sample_ratio_ppm = 0
# 可选：进程关闭时等待导出完成的最大秒数，范围为 1 至 30；默认 5。
shutdown_timeout_seconds = 5

# 可选区块：Worker 控制面；省略整个区块时使用默认 socket 路径。
[worker_control]
# 可选：Worker 控制面 Unix socket 绝对路径；默认 /run/hv-auction/worker/control.sock。
socket_path = "/run/hv-auction/worker/control.sock"

# 可选区块：各组 managed 默认 false，沿用公共/角色 TOML；本示例的候选值不接管已有部署。
# economics/schedule 接管后需重启 Admin 与 Worker，其余组需重启 Worker；不改写既有拍卖和任务事实。

# 可选区块：后续新拍卖经济模板；managed 为 true 时才覆盖本组部署参数。
[operations.economics]
# 可选：由管理页配置；省略时为 false。
managed = false
# 可选：默认底价（Credits），范围 1000-1000000000；省略时为 1000。
start_price = 1000
# 可选：加价幅度（PPM），范围 0-1000000；省略时为 50000。
bid_increment_ppm = 50000
# 可选：软截止窗口（秒），范围 0-604800；省略时为 60。
soft_close_window_seconds = 60
# 可选：软截止延长（秒），范围 1-604800；省略时为 60。
soft_close_extension_seconds = 60
# 可选：取消截止窗口（秒），范围 0-604800；省略时为 86400。
cancel_cutoff_seconds = 86400
# 可选：允许代理竞价；省略时为 true。
proxy_enabled = true
# 可选：默认代理模式；省略时为 "fast"。
proxy_default_mode = "fast"
# 可选：慢速代理间隔（秒），范围 1-604800；省略时为 600。
proxy_slow_interval_seconds = 600
# 可选：被超价使用次数上限（0 为不限），范围 0-1000；省略时为 3。
proxy_max_outbid_uses = 3
# 可选：最终阶段提前量（秒），范围 1-604800；省略时为 900。
final_phase_lead_seconds = 900

# 可选区块：自动周排期；managed 为 true 时才覆盖本组部署参数。
[operations.schedule]
# 可选：由管理页配置；省略时为 false。
managed = false
# 可选：启用自动排期；省略时为 false。
enabled = false
# 可选：排期时区（IANA）；省略时为 "UTC"。
timezone = "UTC"
# 可选：预览星期；省略时为 "Thursday"。
preview_day = "Thursday"
# 可选：预览时间（HH:MM）；省略时为 "22:00"。
preview_time = "22:00"
# 可选：开拍星期；省略时为 "Friday"。
open_day = "Friday"
# 可选：开拍时间（HH:MM）；省略时为 "00:00"。
open_time = "00:00"
# 可选：结束星期；省略时为 "Saturday"。
nominal_end_day = "Saturday"
# 可选：结束时间（HH:MM）；省略时为 "12:00"。
nominal_end_time = "12:00"
# 可选：排期世界；省略时为 ["main","isekai"]。
worlds = ["main","isekai"]

# 可选区块：论坛同步；managed 为 true 时才覆盖本组部署参数。
[operations.forum]
# 可选：是否由管理页覆盖论坛同步参数，默认关闭；省略时为 false。
managed = false
# 可选：是否启用主题发布和回帖同步；省略时为 false。
enabled = false
# 可选：每轮论坛任务批量上限，范围 1-100；省略时为 100。
batch_size = 100
# 可选：论坛轮询间隔秒数，范围 1-86400；省略时为 300。
poll_interval_seconds = 300
# 可选：论坛轮询随机抖动秒数，范围 0-86400；省略时为 5。
jitter_seconds = 5
# 可选：单次响应最大字节数，范围 1-8388608；省略时为 2097152。
maximum_response_bytes = 2097152
# 可选：单次主题扫描最多页数，范围 1-20；省略时为 10。
maximum_topic_pages = 10
# 可选：连续论坛请求的最小间隔毫秒数，范围 1-60000；省略时为 750。
minimum_request_interval_millis = 750
# 可选：单次 HTTP 请求超时秒数，范围 1-300；省略时为 30。
request_timeout_seconds = 30
# 可选：单个主题任务的完整超时秒数，范围 1-3600；省略时为 240。
item_timeout_seconds = 240
# 可选：单个主题任务 claim 租约秒数，范围 1-86400；省略时为 300。
lease_duration_seconds = 300

# 可选区块：运维告警；managed 为 true 时才覆盖本组部署参数。
[operations.alerts]
# 可选：是否由管理页覆盖运维告警参数，默认关闭；省略时为 false。
managed = false
# 可选：是否启用告警扫描和通知；省略时为 false。
enabled = false
# 可选：各告警循环的扫描间隔秒数，范围 1-86400；省略时为 60。
scan_interval_seconds = 60
# 可选：不大于扫描间隔的随机抖动秒数，范围 0-86400；省略时为 5。
jitter_seconds = 5
# 可选：健康来源读取超时秒数，范围 1-30；省略时为 5。
source_timeout_seconds = 5
# 可选：同轮告警合并窗口秒数，范围 1-3600；省略时为 120。
batch_window_seconds = 120
# 可选：同类告警通知冷却秒数，范围 1-604800；省略时为 1_800。
cooldown_seconds = 1_800
# 可选：告警批次租约秒数，必须覆盖四倍来源读取超时，范围 1-86400；省略时为 120。
claim_lease_seconds = 120
# 可选：失败告警的持久化重试间隔秒数，范围 1-86400；省略时为 300。
retry_delay_seconds = 300
# 可选：每轮最多处理的告警信号数，范围 1-64；省略时为 64。
max_signals_per_scan = 64
# 可选：单个通知批次最多信号数，范围 1-64；省略时为 20。
max_batch_items = 20
# 可选：单条告警正文的最大字节数，范围 256-16384；省略时为 4096。
max_body_bytes = 4096
# 可选：待投递数量阈值，范围 1-9007199254740991；省略时为 1。
delivery_pending_count_threshold = 1
# 可选：待投递最老记录年龄阈值秒数，范围 1-2592000；省略时为 900。
delivery_pending_age_seconds = 900
# 可选：投递人工对账数量阈值，范围 1-9007199254740991；省略时为 1。
delivery_manual_reconcile_count_threshold = 1
# 可选：履约积压数量阈值，范围 1-9007199254740991；省略时为 1。
fulfillment_backlog_count_threshold = 1
# 可选：履约积压年龄阈值秒数，范围 1-2592000；省略时为 900。
fulfillment_backlog_age_seconds = 900
# 可选：恢复付款逾期数量阈值，范围 1-9007199254740991；省略时为 1。
recovery_overdue_count_threshold = 1
# 可选：恢复付款逾期年龄阈值秒数，范围 1-2592000；省略时为 900。
recovery_overdue_age_seconds = 900
# 可选：通知使用的游戏世界，只允许 main 或 isekai；省略时为 "main"。
world_id = "main"
# 可选：通知收件人，启用并接管告警时必填；省略时为 ""。
recipient = ""

# 可选区块：Worker 主循环；managed 为 true 时才覆盖本组部署参数。
[operations.worker]
# 可选：由管理页配置；省略时为 false。
managed = false
# 可选：并发数，范围 1-1000；省略时为 8。
concurrency = 8
# 可选：轮询间隔秒数，范围 1-86400；省略时为 60。
poll_interval_seconds = 60
# 可选：每轮批量上限，范围 1-1000；省略时为 100。
batch_limit = 100
# 可选：轮询随机抖动秒数，范围 0-86400；省略时为 5。
jitter_seconds = 5
# 可选：单项处理超时秒数，范围 1-86400；省略时为 30。
item_timeout_seconds = 30
# 可选：恢复任务持久化重试间隔秒数，范围 1-86400；省略时为 60。
recovery_retry_delay_seconds = 60

# 可选区块：独立投递循环；由 operations.worker.managed 统一决定是否接管。
[operations.worker.delivery]
# 可选：每轮投递批量上限，范围 1-1000；省略时为 100。
batch_limit = 100
# 可选：投递并发上限，实际值仍受 transport 约束，范围 1-1000；省略时为 8。
concurrency = 8
# 可选：投递轮询间隔秒数，范围 1-86400；省略时为 60。
poll_interval_seconds = 60
# 可选：投递轮询抖动秒数，范围 0-86400；省略时为 5。
jitter_seconds = 5
# 可选：投递 claim 租约秒数，范围 1-86400；省略时为 60。
lease_duration_seconds = 60
# 可选：发送期间续租间隔秒数，范围 1-86400；省略时为 10。
renew_interval_seconds = 10
# 可选：发送结果写回宽限秒数，范围 1-86400；省略时为 300。
sending_grace_seconds = 300
# 可选：完整投递请求超时秒数，范围 1-86400；省略时为 180；MoogleMail 启用时须大于其读取超时两倍。
request_timeout_seconds = 180
# 可选：投递终态写回超时秒数，范围 1-300；省略时为 5。
finalize_timeout_seconds = 5

# 可选区块：独立履约循环；由 operations.worker.managed 统一决定是否接管。
[operations.worker.fulfillment]
# 可选：每轮履约批量上限，范围 1-1000；省略时为 100。
batch_limit = 100
# 可选：履约并发上限，范围 1-1000；省略时为 8。
concurrency = 8
# 可选：履约轮询间隔秒数，范围 1-86400；省略时为 60。
poll_interval_seconds = 60
# 可选：履约轮询抖动秒数，范围 0-86400；省略时为 5。
jitter_seconds = 5
# 可选：履约 claim 租约秒数，范围 1-86400；省略时为 60。
lease_duration_seconds = 60
# 可选：单项履约超时秒数，范围 1-86400；省略时为 30。
item_timeout_seconds = 30
# 可选：履约持久化重试间隔秒数，范围 1-86400；省略时为 60。
retry_delay_seconds = 60

# 可选区块：独立恢复循环；由 operations.worker.managed 统一决定是否接管。
[operations.worker.recovery]
# 可选：每阶段恢复批量上限，范围 1-1000；省略时为 100。
batch_limit = 100
# 可选：恢复 action 并发上限，范围 1-1000；省略时为 8。
concurrency = 8
# 可选：恢复轮询间隔秒数，范围 1-86400；省略时为 60。
poll_interval_seconds = 60
# 可选：恢复轮询抖动秒数，范围 0-86400；省略时为 5。
jitter_seconds = 5
# 可选：恢复 action 租约秒数，范围 1-86400；省略时为 60。
lease_duration_seconds = 60
# 可选：单项恢复超时秒数，范围 1-86400；省略时为 30。
item_timeout_seconds = 30
# 可选：余额低水位阈值，单位 Credits，范围 0-9007199254740991；省略时为 100。
low_balance_threshold = 100
# 可选：余额健康信息刷新间隔秒数，范围 1-86400；省略时为 60。
health_refresh_interval_seconds = 60
# 可选：余额证据陈旧阈值秒数，范围 1-86400；省略时为 300。
evidence_stale_after_seconds = 300

# 可选区块：邮件调度和处理预算；省略时保持旧文件指纹并沿用 Worker 部署配置。
[operations.mail]
# 可选：是否由管理页接管以下参数，默认 false；重启 Worker 后生效，不开启全局邮件开关。
managed = false
# 可选：五字段 cron、旧版描述符或 @every；支持 TZ=/CRON_TZ= 时区前缀，默认每五分钟。
schedule = "*/5 * * * *"
# 可选：单次响应最大字节数，范围 1-8388608；默认 8388608（8 MiB）。
maximum_response_bytes = 8388608
# 可选：连续请求最小间隔毫秒数，范围 1-60000；默认 1000。
minimum_request_interval_millis = 1000
# 可选：单次 HTTP 请求超时秒数，范围 1-300；默认 15。
request_timeout_seconds = 15
# 可选：每轮邮件读取上限，范围 1-1000；默认 100。
batch_size = 100
# 可选：每轮读取页数上限，范围 1-100；默认 20。
maximum_pages = 20
# 可选：计划触发后随机抖动上限秒数，范围 0-86400；默认 5。
jitter_seconds = 5
# 可选：邮箱 claim 租约秒数，范围 1-86400；默认 60，不改写已持有的租约。
lease_duration_seconds = 60
# 可选：续租间隔秒数，必须大于零且小于租约；默认 10。
renew_interval_seconds = 10
# 可选：每轮读取的内联尝试次数，范围 1-10；默认 3。
fetch_attempts = 3
# 可选：单次读取总超时秒数，范围 1-300 且大于 request_timeout_seconds；默认 30。
fetch_timeout_seconds = 30
# 可选：每封邮件处理的内联尝试次数，范围 1-10；默认 3。
process_attempts = 3
# 可选：单次邮件处理总超时秒数，范围 1-300 且大于 request_timeout_seconds；默认 30。
item_timeout_seconds = 30
# 可选：单次邮箱 claim 的总处理预算秒数，范围 1-86400 且至少覆盖一次 fetch_timeout_seconds 与 item_timeout_seconds；默认 600。
batch_timeout_seconds = 600
# 可选：指数退避基础秒数，范围 1-300；默认 1。
retry_base_seconds = 1
# 可选：指数退避上限秒数，范围 1-300 且不小于 retry_base_seconds；默认 30。
retry_maximum_seconds = 30

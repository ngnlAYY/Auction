# EPYC 9645 KVM 快照没有 RDSEED，不能直接启用完整 znver5 特性集合。
# 仅由 cargo --config 显式选择；不作为工作区默认配置，不传给 Web 构建。

[build]
# 必填：显式目标将下面的 CPU 参数限制在后端目标，host 构建脚本/过程宏不继承它。
target = "x86_64-unknown-linux-gnu"
# 可选：限制本机构建并发以控制完整 LTO 峰值内存；不决定部署进程的运行线程数。
jobs = 2

[target.x86_64-unknown-linux-gnu]
# 必填：以 v4 为基础，仅增加部署 VM 已暴露的 Rust 支持特性；不用 native 或完整型号隐含特性。
rustflags = [
    "-C", "target-cpu=x86-64-v4",
    "-C", "target-feature=+adx,+aes,+avx512bf16,+avx512bitalg,+avx512ifma,+avx512vbmi,+avx512vbmi2,+avx512vnni,+avx512vpopcntdq,+gfni,+pclmulqdq,+rdrand,+sha,+sse4a,+vaes,+vpclmulqdq,+xsavec,+xsaveopt,+xsaves,+avxvnni,+avx512vp2intersect",
]

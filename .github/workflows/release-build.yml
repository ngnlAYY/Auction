name: auction-release-build

# 两个调用方复用同一发布构建：手动触发的候选构建，以及 tag 触发的正式发布。
# 只构建并上传 1 天候选包；正式制品、来源证明与 GitHub Release 由 release 工作流负责。
on:
  workflow_call:
    inputs:
      web_stack:
        description: 候选构建的页面技术栈
        required: false
        type: string
        default: dioxus
    outputs:
      candidate-artifact:
        description: 本次发布候选包的 Actions artifact 名称
        value: ${{ jobs.build.outputs.candidate-artifact }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      candidate-artifact: ${{ steps.web-stack.outputs.candidate_artifact }}
    env:
      # 私有库 runner 的内存有限，限制并发；不放宽 Fat LTO 或 CPU 基线。
      CARGO_BUILD_JOBS: "2"
      # 技术栈只由调用方输入决定；正式发行不传该输入，缺省仍是 dioxus。
      AUCTION_WEB_STACK: ${{ inputs.web_stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 在任何工具安装与缓存恢复之前解析并校验输入；大小写错误、空串与不支持的组合都在这里失败。
      - name: Resolve web stack selection
        id: web-stack
        env:
          AUCTION_WEB_STACK: ${{ inputs.web_stack }}
        run: |
          source ci/release/build-identity.sh || exit 1
          public_stack=$(web_surface_stack public)
          admin_stack=$(web_surface_stack admin)
          stack_id="public-${public_stack}_admin-${admin_stack}"
          tools='rust,sccache'
          if web_stack_uses_dioxus; then
            tools+=",cargo:dioxus-cli,github:wasm-bindgen/wasm-bindgen,github:WebAssembly/binaryen,http:esbuild"
          fi
          if web_stack_uses_solid; then
            tools+=',bun'
          fi
          if web_stack_uses_solid; then
            uses_solid=true
            suffix=-solid
          else
            uses_solid=false
            suffix=
          fi
          if [[ ${GITHUB_REF_TYPE:-} == tag ]] && web_stack_uses_solid; then
            printf 'Solid 的候选构建请在分支上触发；正式发行只产出 Rust 版页面。\n' >&2
            exit 1
          fi
          candidate_artifact="release-candidate-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}${suffix}"
          printf 'Web 技术栈：public=%s admin=%s；候选包 %s\n' \
            "$public_stack" "$admin_stack" "$candidate_artifact"
          {
            printf 'public_stack=%s\n' "$public_stack"
            printf 'admin_stack=%s\n' "$admin_stack"
            printf 'stack_id=%s\n' "$stack_id"
            printf 'uses_solid=%s\n' "$uses_solid"
            printf 'candidate_artifact=%s\n' "$candidate_artifact"
            printf 'MISE_ENABLE_TOOLS=%s\n' "$tools"
          } >> "$GITHUB_ENV"
          {
            printf 'stack_id=%s\n' "$stack_id"
            printf 'uses_solid=%s\n' "$uses_solid"
            printf 'candidate_artifact=%s\n' "$candidate_artifact"
            printf 'mise_tools=%s\n' "$tools"
          } >> "$GITHUB_OUTPUT"
      - name: Ensure patched rustup
        run: bash ci/tools/rustup.sh
      # dx 由 mise 按上游发布包自带的 Cargo.lock 从源码构建，需要本机编译依赖；brotli 用于页面预压缩。
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake pkg-config libssl-dev build-essential brotli
      # mise 按 mise.lock 安装发布工具；Rust 的版本、组件与目标取自 rust-toolchain.toml。
      # 发布制品的作业不恢复 mise 缓存：下载的工具每次按锁文件校验和验证，dx 每次重新编译。
      - name: Install tools with mise
        env:
          MISE_ENABLE_TOOLS: ${{ steps.web-stack.outputs.mise_tools }}
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8
          cache: false
      # 依赖准备允许联网；构建阶段只校验凭据并调用已安装的本地工具。
      - name: Prepare web dependencies
        if: steps.web-stack.outputs.uses_solid == 'true'
        run: mise run web-prepare
      # rust-cache v2.9.3；递归清理 target，仅保留编译缓存，不复用发布结论。
      - name: Restore release build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: v1-auction-build
          key: ubuntu-24.04-release
          cache-workspace-crates: "true"
          cache-on-failure: "true"
          cache-bin: "false"
          save-if: ${{ github.event_name != 'pull_request' }}
      # 缓存服务凭据只注入能读 Actions cache 的 action 上下文，run: 步骤默认没有。
      # 这里只输出 step outputs，再由构建步骤显式赋值，避免 token 在整个 job 里长期驻留。
      - name: Read Actions cache credentials
        id: cache-credentials
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.setOutput('url',
              process.env.ACTIONS_RESULTS_URL || '');
            core.setOutput('token',
              process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.setOutput('v2',
              process.env.ACTIONS_CACHE_SERVICE_V2 || '');
      # rust-cache 保存时会清掉 target 下的非 Cargo 目录，制品、dx 与 Solid 页面产物必须单独缓存。
      # 键带实际技术栈与源码身份指纹，两种组合互不命中；命中即 BUILD-INFO 一致、直接跳过
      # WASM 与 Fat LTO。前缀回退给只改文档/运维正文的提交复用上一次产物与增量目录，
      # 构建输入一致时 release.sh 仍会复用。
      - name: Compute release source fingerprint
        id: source
        env:
          RUSTC_WRAPPER: sccache
        run: |
          fingerprint=$(bash ci/release/release.sh source-fingerprint)
          printf 'fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore release artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/dist/artifacts
            target/dx
            target/web
          key: release-artifacts-${{ steps.web-stack.outputs.stack_id }}-${{ steps.source.outputs.fingerprint }}
          restore-keys: |
            release-artifacts-${{ steps.web-stack.outputs.stack_id }}-
          fail-on-cache-miss: false
      # 复用唯一发布入口：API-only 对照、双端 Web、四程序、隔离和归档门禁。
      # sccache 只用本步骤注入的 V2 缓存上下文；缺失时使用本地缓存。
      - name: Build and verify complete release package
        env:
          ACTIONS_RESULTS_URL: ${{ steps.cache-credentials.outputs.url }}
          ACTIONS_RUNTIME_TOKEN: ${{ steps.cache-credentials.outputs.token }}
          ACTIONS_CACHE_SERVICE_V2: ${{ steps.cache-credentials.outputs.v2 }}
          SCCACHE_CACHE_SIZE: 3G
          RUSTC_WRAPPER: sccache
        run: |
          if [[ -n "$ACTIONS_RESULTS_URL" && -n "$ACTIONS_RUNTIME_TOKEN" &&
                -n "$ACTIONS_CACHE_SERVICE_V2" ]]; then
            export SCCACHE_GHA_ENABLED=true SCCACHE_GHA_VERSION=auction-mise-20261117
          else
            unset SCCACHE_GHA_ENABLED SCCACHE_GHA_VERSION
          fi
          # 复用发布入口的工具选择与 daemon 地址；缓存启动失败不能阻断真实编译。
          source ci/release/build-identity.sh
          configure_build_tools
          if ! sccache rustc -vV >/dev/null; then
            printf '::warning::sccache 缓存不可用，禁用包装器并继续发布构建。\n'
            export RUSTC_WRAPPER=
          fi
          bash ci/release/release.sh release-check
      # 候选包只供本次运行的上传/发布使用，保留 1 天；检查未全部通过时不会出现正式制品。
      - name: Upload release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.web-stack.outputs.candidate_artifact }}
          path: |
            target/dist/package/*.tar.gz
            target/dist/package/SHA256SUMS
            target/dist/package/DEPENDENCIES.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

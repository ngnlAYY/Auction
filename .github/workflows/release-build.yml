name: auction-release-build

# 两个调用方复用同一发布构建：main 推送/手动的候选构建，以及 tag 触发的正式发布。
# 只构建并上传 1 天候选包；正式制品、来源证明与 GitHub Release 由 release 工作流负责。
on:
  workflow_call:
    outputs:
      candidate-artifact:
        description: 本次发布候选包的 Actions artifact 名称
        value: release-candidate-${{ github.sha }}-${{ github.run_attempt }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # 私有库 runner 的内存有限，限制并发；不放宽 Fat LTO 或 CPU 基线。
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure patched rustup
        run: bash ci/tools/rustup.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
      # rust-cache v2.9.3；递归清理 target，仅保留编译缓存，不复用发布结论。
      - name: Restore release build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: v1-auction-build
          key: ubuntu-24.04-release
          cache-workspace-crates: "true"
          cache-on-failure: "true"
          cache-bin: "false"
          save-if: ${{ github.event_name != 'pull_request' }}
      # 独立源码锁图修复工具自身的证书库；缓存键只绑定配方，前缀回退后由安装回执逐字节校验。
      - name: Restore patched release tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/build-tools
          key: release-tools-linux-${{ hashFiles('ci/tools/bootstrap.sh', 'ci/release/build-identity.sh', 'ci/tools/locks/*.lock', 'ci/tools/patches/*.patch', 'rust-toolchain.toml') }}
          restore-keys: |
            release-tools-linux-
      - name: Check release tool receipt
        id: release-tools
        run: |
          if bash ci/tools/bootstrap.sh verify release; then
            printf 'needs-build=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'needs-build=true\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Install native tool build dependencies
        if: steps.release-tools.outputs.needs-build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake pkg-config libssl-dev build-essential patch
      - name: Build and verify release tools
        run: |
          bash ci/tools/bootstrap.sh install release
          printf '%s\n' "$GITHUB_WORKSPACE/target/build-tools/bin" >> "$GITHUB_PATH"
      # 缓存服务凭据只注入能读 Actions cache 的 action 上下文，run: 步骤默认没有。
      # 这里只输出 step outputs，再由构建步骤显式赋值，避免 token 在整个 job 里长期驻留。
      - name: Read Actions cache credentials
        id: cache-credentials
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            core.setOutput('url',
              process.env.ACTIONS_RESULTS_URL || '');
            core.setOutput('token',
              process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.setOutput('v2',
              process.env.ACTIONS_CACHE_SERVICE_V2 || '');
      # rust-cache 保存时会清掉 target 下的非 Cargo 目录，制品与 dx 产物必须单独按源码身份缓存。
      # 键是源码身份指纹，命中即 BUILD-INFO 一致、直接跳过 WASM 与 Fat LTO；前缀回退给
      # 只改文档/运维正文的提交复用上一次产物与 dx 增量目录，构建输入一致时 release.sh 仍会复用。
      - name: Compute release source fingerprint
        id: source
        env:
          RUSTC_WRAPPER: sccache
        run: |
          fingerprint=$(bash ci/release/release.sh source-fingerprint)
          printf 'fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore release artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/dist/artifacts
            target/dx
          key: release-artifacts-${{ steps.source.outputs.fingerprint }}
          restore-keys: |
            release-artifacts-
          fail-on-cache-miss: false
      # 复用唯一发布入口：API-only 对照、双端 Web、四程序、隔离和归档门禁。
      # sccache 只用本步骤注入的 V2 缓存上下文；缺失时使用本地缓存。
      - name: Build and verify complete release package
        env:
          ACTIONS_RESULTS_URL: ${{ steps.cache-credentials.outputs.url }}
          ACTIONS_RUNTIME_TOKEN: ${{ steps.cache-credentials.outputs.token }}
          ACTIONS_CACHE_SERVICE_V2: ${{ steps.cache-credentials.outputs.v2 }}
          SCCACHE_CACHE_SIZE: 3G
          RUSTC_WRAPPER: sccache
        run: |
          if [[ -n "$ACTIONS_RESULTS_URL" && -n "$ACTIONS_RUNTIME_TOKEN" &&
                -n "$ACTIONS_CACHE_SERVICE_V2" ]]; then
            export SCCACHE_GHA_ENABLED=true SCCACHE_GHA_VERSION=auction-tls-20261022
          else
            unset SCCACHE_GHA_ENABLED SCCACHE_GHA_VERSION
          fi
          # 复用发布入口的工具校验与 daemon 地址；缓存启动失败不能阻断真实编译。
          source ci/release/build-identity.sh
          configure_build_tools
          if ! sccache rustc -vV >/dev/null; then
            printf '::warning::sccache 缓存不可用，禁用包装器并继续发布构建。\n'
            export RUSTC_WRAPPER=
          fi
          bash ci/release/release.sh release-check
      # 候选包只供本次运行的上传/发布使用，保留 1 天；检查未全部通过时不会出现正式制品。
      - name: Upload release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/dist/package/*.tar.gz
            target/dist/package/SHA256SUMS
            target/dist/package/DEPENDENCIES.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

name: auction-build

on:
  push:
    # 版本 tag 由 auction-release 工作流处理；普通 CI 不重复构建发布制品。
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
  schedule:
    # 每周一 04:17 UTC 审计默认分支与最近一个发布 tag 的锁定依赖；避开整点排队。
    - cron: '17 4 * * 1'

permissions:
  contents: read

# 自动运行、PR 和手动运行分别排队；同一分支/PR 的新提交取消旧任务。
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
    github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  docs:
    # 定时事件只复用 security-audit，不启动完整编译、制品或发布流程。
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # 仅此 job 读取 PR 元数据，用于取消同仓库同提交的重复 push 检查。
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run-checks: ${{ steps.scope.outputs.run-checks }}
    env:
      # 本作业只启用策略门禁与格式检查需要的工具；其余工具不安装。
      MISE_ENABLE_TOOLS: rust,ripgrep
    steps:
      - name: Select checks without duplicate PR runs
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == push && "$REF_TYPE" == branch &&
            "$REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            heads=$(gh api --method GET --paginate "repos/$GH_REPO/pulls" \
              -f state=open -f "head=$REPOSITORY_OWNER:$REF_NAME" \
              --jq '.[] | [.head.repo.full_name, .head.sha] | @tsv')
            if grep -Fxq -- "$GH_REPO"$'\t'"$SOURCE_SHA" <<<"$heads"; then
              printf 'run-checks=false\n' >> "$GITHUB_OUTPUT"
              printf '%s\n' '同提交已有 PR 检查；跳过重复 push。' \
                >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          printf 'run-checks=true\n' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.scope.outputs.run-checks == 'true'
        with:
          # published-migrations 需要全部发布 tag 与完整历史，浅克隆会误判为通过。
          fetch-depth: 0
          persist-credentials: false
      - name: Ensure patched rustup
        if: steps.scope.outputs.run-checks == 'true'
        run: bash ci/tools/rustup.sh
      # 布局、配置和五语言门禁依赖 Perl，不依赖 runner 镜像预装；rg 与 Rust 由下一步的 mise 提供。
      - name: Install Perl
        if: steps.scope.outputs.run-checks == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends perl
      # mise 按 mise.lock 安装 MISE_ENABLE_TOOLS 列出的工具；Rust 的版本、组件与目标取自 rust-toolchain.toml。
      - name: Install tools with mise
        if: steps.scope.outputs.run-checks == 'true'
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8
          cache_key_prefix: mise-v1-checks
      # 廉价静态门禁先行，失败时不启动编译或安装审计工具。
      - name: Check repository policy and formatting
        if: steps.scope.outputs.run-checks == 'true'
        run: bash ci/checks/check.sh all fmt

  verify:
    needs: docs
    if: needs.docs.outputs.run-checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # 仅静态检查，不生成调试信息；本地 dev 仍保留行号回溯。
      CARGO_PROFILE_DEV_DEBUG: "0"
      # Cargo 与 web/ 静态检查所需工具；与 docs 作业共用 mise 缓存。
      MISE_ENABLE_TOOLS: rust,ripgrep,bun
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure patched rustup
        run: bash ci/tools/rustup.sh
      - name: Install tools with mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8
          cache_key_prefix: mise-v1-checks
      - name: Prepare web dependencies
        run: mise run web-prepare
      # rust-cache v2.9.3；自动键隔离 job、平台、工具链和依赖图。
      # 非 PR 事件才写缓存：PR 缓存作用域与合并结果不同，全写会挤占同一仓库额度。
      # save-if 必须写成 ${{ }} 表达式；字面字符串不等于 "true"，会让缓存永远不保存。
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: v1-auction-build
          cache-workspace-crates: "true"
          cache-on-failure: "true"
          cache-bin: "false"
          save-if: ${{ github.event_name != 'pull_request' }}
      # docs 已完成格式和策略门禁；此处不重复执行，不运行测试。
      - run: bash ci/checks/check.sh check dependency-versions lint wasm rustdoc web

  test:
    needs: docs
    if: needs.docs.outputs.run-checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # 测试构建不生成调试信息：target 与构建缓存更小，链接更快。panic 消息里的源码位置
      # 不依赖调试信息，失败时只有 backtrace 缺少行号。
      CARGO_PROFILE_DEV_DEBUG: "0"
      # 测试入口是 mise 任务；启用 Rust 与 web/ 测试需要的 bun，mise run 不会顺带安装其余工具。
      # 浏览器接线测试使用运行器自带的 Firefox；驱动与 wasm 测试运行器由 mise 提供。
      MISE_ENABLE_TOOLS: rust,bun,github:wasm-bindgen/wasm-bindgen,github:mozilla/geckodriver
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure patched rustup
        run: bash ci/tools/rustup.sh
      - name: Install tools with mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8
          cache_key_prefix: mise-v1-test
      - name: Prepare web dependencies
        run: mise run web-prepare
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: v1-auction-test
          cache-workspace-crates: "true"
          cache-on-failure: "true"
          cache-bin: "false"
      - name: Install PostgreSQL 18 for integration tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes --no-install-recommends postgresql-18
          # 运行器可能已有系统 PostgreSQL；18 集群因此未必占用 5432，且 systemd
          # 在部分 runner 上不可用。没有 18 集群时先创建，再按实际端口建立连接串。
          if ! pg_lsclusters -h | awk '$1 == 18 { found = 1 } END { exit !found }'; then
            sudo pg_createcluster 18 main --start
          fi
          sudo pg_ctlcluster 18 main start || true
          sudo pg_lsclusters
          port="$(pg_lsclusters -h | awk '$1 == 18 { print $3; exit }')"
          test -n "$port"
          # 测试夹具会在该维护连接上创建 auction_runtime 角色与模板库；
          # 生产运行账号本身没有 DDL，这两个属性只属于 CI 测试维护角色。
          sudo -u postgres psql -p "$port" -v ON_ERROR_STOP=1 -c "CREATE ROLE auction_test LOGIN CREATEDB CREATEROLE PASSWORD 'auction_test';"
          sudo -u postgres createdb -p "$port" -O auction_test auction_test
          echo "AUCTION_TEST_DATABASE_URL=postgresql://auction_test:auction_test@127.0.0.1:$port/auction_test" >> "$GITHUB_ENV"
      - name: Run pure and double tests
        run: mise run test
      - name: Run web behavior tests
        run: mise run web-test
      - name: Run PostgreSQL 18 integration tests
        run: mise run test-db
      # 迁移兼容声明单独成步：失败时直接指名被证伪的 compatible 迁移，
      # 不与其它集成测试的失败混在一起。`mise run test-db` 已包含同一组测试。
      - name: Verify migration compatibility declarations
        run: mise run test-db-compat
      - name: Run browser transport tests
        run: mise run test-wasm

  security-audit:
    needs: docs
    # docs 在 schedule 中跳过；状态函数允许此时继续执行独立审计。
    if: >-
      !cancelled() &&
      (github.event_name == 'schedule' ||
       (needs.docs.result == 'success' && needs.docs.outputs.run-checks == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # 审计作业只启用 Rust 与两个 Cargo 子命令。
      MISE_ENABLE_TOOLS: rust,cargo:cargo-audit,cargo:cargo-machete
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 定时与手动运行要审计最近的发布 tag，需要其提交对象；push/PR 保持浅克隆。
          # 用字符串 '0'：表达式里数字 0 为假值，会被 `||` 改写成 1。
          fetch-depth: >-
            ${{ (github.event_name == 'schedule' ||
            github.event_name == 'workflow_dispatch') && '0' || '1' }}
          persist-credentials: false
      - name: Ensure patched rustup
        run: bash ci/tools/rustup.sh
      # cargo-audit 与 cargo-machete 由 mise 按上游发布包自带的 Cargo.lock 从源码构建，需要本机编译依赖。
      - name: Install tool build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake pkg-config libssl-dev build-essential
      # 构建结果随 mise 数据目录缓存，键含 mise.toml 与 mise.lock 的摘要；版本变化时重建。
      - name: Install tools with mise
        id: install-audit
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8
          cache_key_prefix: mise-v1-audit
      # 缓存命中也获取最新公告，漏洞和全部警告均失败，不自动修改锁定依赖。
      # 本步审计默认分支的当前 Cargo.lock；最近一个发布 tag 由下一步审计。
      - run: bash ci/checks/check.sh dependency-audit
      # 部署只用发布 tag 的 Release 资产，默认分支已修复的公告不代表线上程序安全。
      # 只在定时与手动运行时执行，旧发布的新公告不阻塞无关 push/PR；默认分支审计失败时
      # 仍照常执行，两项结果分别可见。没有发布 tag 时输出提示并通过。
      - name: Audit latest release tag
        if: >-
          !cancelled() && steps.install-audit.outcome == 'success' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: bash ci/checks/check.sh release-dependency-audit
      - run: bash ci/checks/check.sh dependency-unused
        if: github.event_name != 'schedule'

  msrv:
    needs: docs
    if: needs.docs.outputs.run-checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # MSRV 等于 rust-toolchain.toml 固定的工具链：verify 作业的 Clippy 已经用它编译全部目标与
      # feature，这里不再用第二个工具链重复编译，只核对两处版本声明一致。作业名是 main 的必需
      # 检查，保持不变。
      - run: bash ci/checks/check.sh rust-version

  artifacts:
    # 只依赖 docs，与 verify/security-audit/msrv 并行；正式制品与来源证明由 tag 发布工作流产生。
    # 候选包仅供本次运行核对，不是可部署制品；部署要求构建提交可从发布 tag 到达。
    needs: docs
    # 只在手动触发时运行：部署只接受 tag 发布工作流产出的 Release 资产，main 推送后的
    # 候选包不可部署，不值得每次花 10–20 分钟做 Fat LTO 构建。
    if: >-
      needs.docs.outputs.run-checks == 'true' &&
      github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/release-build.yml

name: auction-build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 自动运行、PR 和手动运行分别排队；同一分支/PR 的新提交取消旧任务。
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
    github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # 仅此 job 读取 PR 元数据，用于取消同仓库同提交的重复 push 检查。
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run-checks: ${{ steps.scope.outputs.run-checks }}
    steps:
      - name: Select checks without duplicate PR runs
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == push && "$REF_TYPE" == branch &&
            "$REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            heads=$(gh api --method GET --paginate "repos/$GH_REPO/pulls" \
              -f state=open -f "head=$REPOSITORY_OWNER:$REF_NAME" \
              --jq '.[] | [.head.repo.full_name, .head.sha] | @tsv')
            if grep -Fxq -- "$GH_REPO"$'\t'"$SOURCE_SHA" <<<"$heads"; then
              printf 'run-checks=false\n' >> "$GITHUB_OUTPUT"
              printf '%s\n' '同提交已有 PR 检查；跳过重复 push。' \
                >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          printf 'run-checks=true\n' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.scope.outputs.run-checks == 'true'
        with:
          persist-credentials: false
      - name: Ensure patched rustup
        if: steps.scope.outputs.run-checks == 'true'
        run: bash ci/tools/rustup.sh
      # 布局、配置和五语言门禁依赖 rg/Perl，不依赖 runner 镜像预装。
      - name: Install check dependencies
        if: steps.scope.outputs.run-checks == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep perl
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        if: steps.scope.outputs.run-checks == 'true'
        with:
          toolchain: 1.99.0
          components: rustfmt
      # 廉价静态门禁先行，失败时不启动编译或安装审计工具。
      - name: Check repository policy and formatting
        if: steps.scope.outputs.run-checks == 'true'
        run: bash ci/checks/check.sh all fmt

  verify:
    needs: docs
    if: needs.docs.outputs.run-checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # 仅静态检查，不生成调试信息；本地 dev 仍保留行号回溯。
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure patched rustup
        run: bash ci/tools/rustup.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      # rust-cache v2.9.2；自动键隔离 job、平台、工具链和依赖图。
      # 非 PR 事件才写缓存：PR 缓存作用域与合并结果不同，全写会挤占同一仓库额度。
      # save-if 必须写成 ${{ }} 表达式；字面字符串不等于 "true"，会让缓存永远不保存。
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: v1-auction-build
          cache-workspace-crates: "true"
          cache-on-failure: "true"
          cache-bin: "false"
          save-if: ${{ github.event_name != 'pull_request' }}
      # docs 已完成格式和策略门禁；此处不重复执行，不运行测试。
      - run: bash ci/checks/check.sh check feature lint wasm

  security-audit:
    needs: docs
    if: needs.docs.outputs.run-checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure patched rustup
        run: bash ci/tools/rustup.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.99.0
      # rust-cache v2.9.2；审计失败也保留工具二进制及安装元数据。
      - name: Restore audit tools cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: cargo-audit-tls-20261022-machete-0.9.2
          cache-bin: "true"
          cache-on-failure: "true"
      # 键只绑定 bootstrap 配方、锁图、补丁与工具链；文档或其他脚本变化不触发重建。
      # 前缀回退恢复的旧工具仍须通过下一步回执校验，不一致时照常重建。
      - name: Restore patched audit binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/audit-tools
          key: audit-tools-linux-${{ hashFiles('ci/tools/bootstrap.sh', 'ci/release/build-identity.sh', 'ci/tools/locks/*.lock', 'ci/tools/patches/*.patch', 'rust-toolchain.toml') }}
          restore-keys: |
            audit-tools-linux-
      - name: Check audit tool receipt
        id: audit-tools
        run: |
          if bash ci/tools/bootstrap.sh verify audit; then
            printf 'needs-build=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'needs-build=true\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Install audit tool build dependencies
        if: steps.audit-tools.outputs.needs-build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake pkg-config libssl-dev build-essential patch
      # 同名旧二进制不满足安全基线；缓存命中也验证独立锁图和二进制回执。
      - name: Install verified cargo-audit
        run: |
          bash ci/tools/bootstrap.sh install audit
          printf '%s\n' "$GITHUB_WORKSPACE/target/audit-tools/bin" >> "$GITHUB_PATH"
      # cargo-machete 的 --version 只输出版本号；程序名前缀会使缓存命中也强制重装。
      - name: Install cargo-machete when needed
        run: |
          if ! version=$(cargo machete --version 2>/dev/null) ||
            [[ "$version" != "0.9.2" ]]; then
            cargo install cargo-machete --locked --version 0.9.2 --force
          fi
      # 缓存命中也联网审计，漏洞和全部警告均失败，不忽略公告。
      - run: bash ci/checks/check.sh dependency-audit
      - run: bash ci/checks/check.sh dependency-unused

  msrv:
    needs: docs
    if: needs.docs.outputs.run-checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure patched rustup
        run: bash ci/tools/rustup.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94.1
      # rust-cache v2.9.2；与 verify 隔离，不跨 Rust 工具链复用产物。
      - name: Restore MSRV build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: v1-auction-build
          key: msrv
          cache-workspace-crates: "true"
          cache-on-failure: "true"
          cache-bin: "false"
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: >-
          cargo +1.94.1 check --locked --workspace --all-targets --all-features

  artifacts:
    # 只依赖 docs，与 verify/security-audit/msrv 并行；正式制品由 publish 在全部检查通过后上传。
    needs: docs
    # PR 和普通分支不做昂贵的完整发布构建。
    if: >-
      needs.docs.outputs.run-checks == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        github.ref == format('refs/heads/{0}',
                             github.event.repository.default_branch)))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # 私有库 runner 的内存有限，限制并发；不放宽 Fat LTO 或 CPU 基线。
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure patched rustup
        run: bash ci/tools/rustup.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
      # rust-cache v2.9.2；递归清理 target，仅保留编译缓存，不复用发布结论。
      - name: Restore release build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: v1-auction-build
          key: ubuntu-24.04-release
          cache-workspace-crates: "true"
          cache-on-failure: "true"
          cache-bin: "false"
          save-if: ${{ github.event_name != 'pull_request' }}
      # 独立源码锁图修复工具自身的证书库；缓存键只绑定配方，前缀回退后由安装回执逐字节校验。
      - name: Restore patched release tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/build-tools
          key: release-tools-linux-${{ hashFiles('ci/tools/bootstrap.sh', 'ci/release/build-identity.sh', 'ci/tools/locks/*.lock', 'ci/tools/patches/*.patch', 'rust-toolchain.toml') }}
          restore-keys: |
            release-tools-linux-
      - name: Check release tool receipt
        id: release-tools
        run: |
          if bash ci/tools/bootstrap.sh verify release; then
            printf 'needs-build=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'needs-build=true\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Install native tool build dependencies
        if: steps.release-tools.outputs.needs-build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake pkg-config libssl-dev build-essential patch
      - name: Build and verify release tools
        run: |
          bash ci/tools/bootstrap.sh install release
          printf '%s\n' "$GITHUB_WORKSPACE/target/build-tools/bin" >> "$GITHUB_PATH"
      # 缓存服务凭据只注入能读 Actions cache 的 action 上下文，run: 步骤默认没有。
      # 这里只输出 step outputs，再由构建步骤显式赋值，避免 token 在整个 job 里长期驻留。
      - name: Read Actions cache credentials
        id: cache-credentials
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            core.setOutput('url',
              process.env.ACTIONS_RESULTS_URL || '');
            core.setOutput('token',
              process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.setOutput('v2',
              process.env.ACTIONS_CACHE_SERVICE_V2 || '');
      # rust-cache 保存时会清掉 target 下的非 Cargo 目录，制品与 dx 产物必须单独按源码身份缓存。
      # 键是源码身份指纹，命中即 BUILD-INFO 一致、直接跳过 WASM 与 Fat LTO；前缀回退给
      # 只改文档/运维正文的提交复用上一次产物与 dx 增量目录，构建输入一致时 release.sh 仍会复用。
      - name: Compute release source fingerprint
        id: source
        env:
          RUSTC_WRAPPER: sccache
        run: |
          fingerprint=$(bash ci/release/release.sh source-fingerprint)
          printf 'fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore release artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/dist/artifacts
            target/dx
          key: release-artifacts-${{ steps.source.outputs.fingerprint }}
          restore-keys: |
            release-artifacts-
          fail-on-cache-miss: false
      # 复用唯一发布入口：API-only 对照、双端 Web、四程序、隔离和归档门禁。
      # sccache 只用本步骤注入的 V2 缓存上下文；缺失时使用本地缓存。
      - name: Build and verify complete release package
        env:
          ACTIONS_RESULTS_URL: ${{ steps.cache-credentials.outputs.url }}
          ACTIONS_RUNTIME_TOKEN: ${{ steps.cache-credentials.outputs.token }}
          ACTIONS_CACHE_SERVICE_V2: ${{ steps.cache-credentials.outputs.v2 }}
          SCCACHE_CACHE_SIZE: 3G
          RUSTC_WRAPPER: sccache
        run: |
          if [[ -n "$ACTIONS_RESULTS_URL" && -n "$ACTIONS_RUNTIME_TOKEN" &&
                -n "$ACTIONS_CACHE_SERVICE_V2" ]]; then
            export SCCACHE_GHA_ENABLED=true SCCACHE_GHA_VERSION=auction-tls-20261022
          else
            unset SCCACHE_GHA_ENABLED SCCACHE_GHA_VERSION
          fi
          # 复用发布入口的工具校验与 daemon 地址；缓存启动失败不能阻断真实编译。
          source ci/release/build-identity.sh
          configure_build_tools
          if ! sccache rustc -vV >/dev/null; then
            printf '::warning::sccache 缓存不可用，禁用包装器并继续发布构建。\n'
            export RUSTC_WRAPPER=
          fi
          bash ci/release/release.sh release-check
      # 候选包只供本次运行的 publish 使用，保留 1 天；检查未全部通过时不会出现正式制品。
      - name: Upload release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/dist/package/*.tar.gz
            target/dist/package/SHA256SUMS
            target/dist/package/DEPENDENCIES.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: [docs, verify, security-audit, msrv, artifacts]
    # 条件同 artifacts；未写状态函数时隐含 success()，任一检查失败都不发布。
    if: >-
      needs.docs.outputs.run-checks == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        github.ref == format('refs/heads/{0}',
                             github.event.repository.default_branch)))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: package
      # 重新核对候选包摘要，避免把传输损坏的文件发布为正式制品。
      - name: Verify release candidate checksums
        working-directory: package
        run: sha256sum --check --strict SHA256SUMS
      # tar 保留 bin 执行权限，外层不重复压缩。
      - name: Upload Linux binaries and checksums
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auction-linux-x86_64-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            package/*.tar.gz
            package/SHA256SUMS
            package/DEPENDENCIES.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Add artifact download summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            printf '## Linux x86_64 完整制品\n\n'
            printf '[下载四程序及校验清单](%s)\n\n' "$ARTIFACT_URL"
            printf '%s\n' '解开外层下载包后，用 SHA256SUMS 校验 tar.gz。'
            printf '%s\n' 'tar 包的 bin/ 含 Public、Admin、Worker 与 auction-cli。'
            printf '%s\n' 'Public/Admin 已内嵌页面；不是 Ryzen 专用包。'
            printf '%s\n' '制品保留 14 天；仅完成静态门禁，不代表运行验收。'
          } >> "$GITHUB_STEP_SUMMARY"

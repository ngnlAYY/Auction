name: auction-build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 自动运行、PR 和手动运行分别排队；同一分支/PR 的新提交取消旧任务。
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
    github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # 仅此 job 读取 PR 元数据，用于取消同仓库同提交的重复 push 检查。
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run-checks: ${{ steps.scope.outputs.run-checks }}
    steps:
      - name: Select checks without duplicate PR runs
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == push && "$REF_TYPE" == branch &&
            "$REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            heads=$(gh api --method GET --paginate "repos/$GH_REPO/pulls" \
              -f state=open -f "head=$REPOSITORY_OWNER:$REF_NAME" \
              --jq '.[] | [.head.repo.full_name, .head.sha] | @tsv')
            if grep -Fxq -- "$GH_REPO"$'\t'"$SOURCE_SHA" <<<"$heads"; then
              printf 'run-checks=false\n' >> "$GITHUB_OUTPUT"
              printf '%s\n' '同提交已有 PR 检查；跳过重复 push。' \
                >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          printf 'run-checks=true\n' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.scope.outputs.run-checks == 'true'
        with:
          persist-credentials: false
      # 布局、配置和五语言门禁依赖 rg/Perl，不依赖 runner 镜像预装。
      - name: Install check dependencies
        if: steps.scope.outputs.run-checks == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep perl
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        if: steps.scope.outputs.run-checks == 'true'
        with:
          toolchain: 1.99.0
          components: rustfmt
      # 廉价静态门禁先行，失败时不启动编译或安装审计工具。
      - name: Check repository policy and formatting
        if: steps.scope.outputs.run-checks == 'true'
        run: bash ci/checks/check.sh all fmt

  verify:
    needs: docs
    if: needs.docs.outputs.run-checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      # rust-cache v2.9.2；自动键隔离 job、平台、工具链和依赖图。
      # 只有默认分支 push 与手动运行写缓存：PR 缓存作用域与合并结果不同，全写会挤占同一仓库额度。
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: v1-auction-build
          cache-workspace-crates: "true"
          cache-on-failure: "true"
          cache-bin: "false"
          save-if: github.event_name != 'pull_request'
      # docs 已完成格式和策略门禁；此处不重复执行，不运行测试。
      - run: bash ci/checks/check.sh check feature lint wasm

  security-audit:
    needs: docs
    if: needs.docs.outputs.run-checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.99.0
      # rust-cache v2.9.2；审计失败也保留工具二进制及安装元数据。
      - name: Restore audit tools cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: cargo-audit-0.22.2-machete-0.9.2
          cache-bin: "true"
          cache-on-failure: "true"
      # 逐个核对工具版本，不能把部分缓存命中视为所有工具已安装。
      - name: Install cargo-audit when needed
        run: |
          if ! version=$(cargo audit --version 2>/dev/null) ||
            [[ "$version" != "cargo-audit 0.22.2" ]]; then
            cargo install cargo-audit --locked --version 0.22.2 --force
          fi
      - name: Install cargo-machete when needed
        run: |
          if ! version=$(cargo machete --version 2>/dev/null) ||
            [[ "$version" != "cargo-machete 0.9.2" ]]; then
            cargo install cargo-machete --locked --version 0.9.2 --force
          fi
      # 缓存命中也联网审计，漏洞和全部警告均失败，不忽略公告。
      - run: bash ci/checks/check.sh dependency-audit
      - run: bash ci/checks/check.sh dependency-unused

  msrv:
    needs: docs
    if: needs.docs.outputs.run-checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94.1
      # rust-cache v2.9.2；与 verify 隔离，不跨 Rust 工具链复用产物。
      - name: Restore MSRV build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: v1-auction-build
          key: msrv
          cache-workspace-crates: "true"
          cache-on-failure: "true"
          cache-bin: "false"
          save-if: github.event_name != 'pull_request'
      - run: >-
          cargo +1.94.1 check --locked --workspace --all-targets --all-features

  artifacts:
    needs: [docs, verify, security-audit, msrv]
    # PR 和普通分支不做昂贵的完整发布构建；手动触发仍须通过全部检查。
    if: >-
      needs.docs.outputs.run-checks == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        github.ref == format('refs/heads/{0}',
                             github.event.repository.default_branch)))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # 私有库 runner 的内存有限，限制并发；不放宽 Fat LTO 或 CPU 基线。
      CARGO_BUILD_JOBS: "2"
      DX_ARCHIVE_SHA256: >-
        4363e4ed2a3f1eb7f4d38d2d59aed59ce43271c44c16b425e92c89a64761fbe7
      # sccache 0.18.0 官方 musl 静态归档；与 dx 一样固定 SHA-256，命中缓存仍复校。
      SCCACHE_ARCHIVE_SHA256: >-
        45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89
      # sccache 只在完整发布档启用：Fat LTO 与多 feature 变体最贵，检查 job 由 rust-cache 覆盖。
      # GHA 后端按 sccache 版本前缀写缓存，升级即整体失效，不会混用旧编译对象。
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: 3G
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
      # rust-cache v2.9.2；递归清理 target，仅保留编译缓存，不复用发布结论。
      - name: Restore release build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: v1-auction-build
          key: ubuntu-24.04-release
          cache-workspace-crates: "true"
          cache-on-failure: "true"
          cache-bin: "false"
          save-if: github.event_name != 'pull_request'
      # cache v6.1.0；只缓存官方 sccache 归档，不缓存编译对象（那些写入 Actions 缓存服务）。
      - name: Restore sccache archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/auction-ci/sccache-0.18.0
          key: sccache-linux-x86_64-0.18.0-${{ env.SCCACHE_ARCHIVE_SHA256 }}
      - name: Install verified sccache
        run: |
          filename=sccache-v0.18.0-x86_64-unknown-linux-musl.tar.gz
          root="$HOME/.cache/auction-ci/sccache-0.18.0"
          archive="$root/$filename"
          tool_dir="$RUNNER_TEMP/auction-sccache"
          mkdir -p "$root" "$tool_dir"
          if [[ ! -f "$archive" ]]; then
            base_url=https://github.com/mozilla/sccache/releases/download
            curl --fail --silent --show-error --location --retry 3 \
              --connect-timeout 10 --max-time 180 \
              "$base_url/v0.18.0/$filename" --output "$archive"
          fi
          printf '%s  %s\n' "$SCCACHE_ARCHIVE_SHA256" "$archive" |
            sha256sum --check --
          tar --extract --gzip --file "$archive" --directory "$tool_dir" \
            --no-same-owner --strip-components=1 \
            sccache-v0.18.0-x86_64-unknown-linux-musl/sccache
          "$tool_dir/sccache" --version
          printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"
      # 缓存服务凭据只注入能读 Actions cache 的 action 上下文，run: 步骤默认没有。
      # 这里只输出 step outputs，再由构建步骤显式赋值，避免 token 在整个 job 里长期驻留。
      - name: Read Actions cache credentials
        id: cache-credentials
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            core.setOutput('url',
              process.env.ACTIONS_RESULTS_URL || '');
            core.setOutput('token',
              process.env.ACTIONS_RUNTIME_TOKEN || '');
      # cache v6.1.0；只缓存固定版本的官方 dx 压缩包，命中后仍校验哈希。
      - name: Restore Dioxus CLI archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/auction-ci/dioxus-0.7.10
          key: dx-linux-x86_64-0.7.10-${{ env.DX_ARCHIVE_SHA256 }}
      - name: Install verified Dioxus CLI
        run: |
          filename=dx-x86_64-unknown-linux-gnu.tar.gz
          archive="$HOME/.cache/auction-ci/dioxus-0.7.10/$filename"
          tool_dir="$RUNNER_TEMP/auction-dx"
          mkdir -p "$(dirname "$archive")" "$tool_dir"
          if [[ ! -f "$archive" ]]; then
            base_url=https://github.com/DioxusLabs/dioxus/releases/download
            curl --fail --silent --show-error --location --retry 3 \
              --connect-timeout 10 --max-time 180 \
              "$base_url/v0.7.10/$filename" --output "$archive"
          fi
          printf '%s  %s\n' "$DX_ARCHIVE_SHA256" "$archive" |
            sha256sum --check --
          tar --extract --gzip --file "$archive" --directory "$tool_dir" \
            --no-same-owner dx
          "$tool_dir/dx" --version
          printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"
      # rust-cache 保存时会清掉 target 下的非 Cargo 目录，制品与 dx 产物必须单独按源码身份缓存。
      # 键是源码身份指纹，命中即 BUILD-INFO 一致、直接跳过 WASM 与 Fat LTO；前缀回退给
      # 只改文档/运维正文的提交复用上一次产物与 dx 增量目录，构建输入一致时 release.sh 仍会复用。
      - name: Compute release source fingerprint
        id: source
        run: |
          fingerprint=$(bash ci/release/release.sh source-fingerprint)
          printf 'fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore release artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/dist/artifacts
            target/dx
          key: release-artifacts-${{ steps.source.outputs.fingerprint }}
          restore-keys: |
            release-artifacts-
          fail-on-cache-miss: false
      # 复用唯一发布入口：API-only 对照、双端 Web、四程序、隔离和归档门禁。
      # sccache 只用本步骤注入的缓存凭据；缺失时回退本地编译，不抹掉构建结果。
      - name: Build and verify complete release package
        env:
          ACTIONS_RESULTS_URL: ${{ steps.cache-credentials.outputs.url }}
          ACTIONS_RUNTIME_TOKEN: ${{ steps.cache-credentials.outputs.token }}
        run: bash ci/release/release.sh release-check
      # upload-artifact v7.0.2；tar 保留 bin 执行权限，外层不重复压缩。
      - name: Upload Linux binaries and checksums
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: auction-linux-x86_64-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/dist/package/*.tar.gz
            target/dist/package/SHA256SUMS
            target/dist/package/DEPENDENCIES.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Add artifact download summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            printf '## Linux x86_64 完整制品\n\n'
            printf '[下载四程序及校验清单](%s)\n\n' "$ARTIFACT_URL"
            printf '%s\n' '解开外层下载包后，用 SHA256SUMS 校验 tar.gz。'
            printf '%s\n' 'tar 包的 bin/ 含 Public、Admin、Worker、auctionctl。'
            printf '%s\n' 'Public/Admin 已内嵌页面；不是 Ryzen 专用包。'
            printf '%s\n' '制品保留 14 天；仅完成静态门禁，不代表运行验收。'
          } >> "$GITHUB_STEP_SUMMARY"

name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets
      - run: cargo check --locked -p auction-storage --all-targets --no-default-features --features postgres
      - run: cargo check --locked -p auction-storage --all-targets --no-default-features --features sqlite
      - run: cargo check --locked -p auction-cache --all-targets --no-default-features --features redis
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: >-
          cargo check --locked -p auction-web
          --target wasm32-unknown-unknown
          --no-default-features --features hydrate

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo +1.94.1 check --locked --workspace --all-targets --all-features

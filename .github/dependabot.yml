---
version: 2
# 只作提示：季度升级窗口之外的常规版本升级不创建 PR（open-pull-requests-limit: 0）。
# 安全公告仍会提示并创建修复 PR，但一律人工评估、不自动合并；修复可随时交付，
# 版本升级只在窗口内按依赖族进行。节奏、冻结日历与门禁见 ops/dependencies.md，
# 窗口日期见 ops/dependencies/upgrade-windows.json。
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore(ci)

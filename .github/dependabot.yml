---
version: 2
# 可选：每周核对 Cargo 依赖与 Actions 固定提交；PR 仍须通过 just verify 与 MSRV 门禁，不自动合并。
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    ignore:
      # Axum 仍传递 tungstenite 0.29；跨版本无法 downcast 1009 close 契约，须与 Axum 同步升级。
      - dependency-name: "tungstenite"
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(ci)

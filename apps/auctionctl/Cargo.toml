[package]
name = "auctionctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
auction-cache = { workspace = true, optional = true }
auction-config.workspace = true
auction-application = { workspace = true, optional = true }
auction-contracts = { workspace = true, optional = true }
auction-integrations = { workspace = true, optional = true }
auction-observability = { workspace = true, optional = true }
auction-storage.workspace = true
chrono.workspace = true
clap.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-util"] }
url.workspace = true
uuid = { workspace = true, features = ["v5"] }

[features]
default = []
cache-redis = ["dep:auction-cache", "auction-cache/redis"]
postgres = [
    "dep:auction-cache",
    "auction-storage/postgres",
    "dep:auction-application",
    "dep:auction-contracts",
    "dep:auction-integrations",
    "dep:auction-observability",
]

[lints]
# 可选：继承工作区统一 lint 策略，不在单包放宽。
workspace = true

[package]
name = "auction-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
auction-public-api = { path = "../auction-public-api", default-features = false }
auction-admin-api = { path = "../auction-admin-api", default-features = false }
auction-worker = { path = "../auction-worker", default-features = false }
auction-config.workspace = true
auction-application.workspace = true
auction-observability.workspace = true
auction-process.workspace = true
auction-setup.workspace = true
auction-storage.workspace = true
clap.workspace = true
libc.workspace = true
tokio = { workspace = true, features = ["process"] }

[features]
# 可选：都不启用时只提供 API，不内嵌任何页面资源。
default = []
# 可选：把本地寄售预览能力转发给同一可执行文件内的三个角色；发布构建仍拒绝开启。
consignment-dev-preview = [
  "auction-public-api/consignment-dev-preview",
  "auction-admin-api/consignment-dev-preview",
  "auction-worker/consignment-dev-preview",
]
# 可选：Public 与 Admin 都内嵌 Dioxus 版页面（默认技术栈）。
web-embed = ["auction-public-api/web-embed", "auction-admin-api/web-embed"]
# 可选：只把 Public 切到 Solid 版；Admin 由 `web-embed` 或 `web-solid-admin` 决定，两端可以不同。
web-solid-public = ["web-embed", "auction-public-api/web-solid"]
# 可选：只把 Admin 与首次设置切到 Solid 版；Public 仍由 `web-embed` 决定。
web-solid-admin = ["web-embed", "auction-admin-api/web-solid"]

[lints]
# 可选：继承工作区统一 lint 策略，不在单包放宽。
workspace = true

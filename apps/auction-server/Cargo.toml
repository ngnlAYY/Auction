[package]
name = "auction-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
auction-public-api = { path = "../auction-public-api", default-features = false }
auction-admin-api = { path = "../auction-admin-api", default-features = false }
auction-worker = { path = "../auction-worker", default-features = false }
auction-config.workspace = true
auction-application.workspace = true
auction-observability.workspace = true
auction-process.workspace = true
auction-setup.workspace = true
auction-storage.workspace = true
clap.workspace = true
libc.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }

[features]
default = []
web-embed = ["auction-public-api/web-embed", "auction-admin-api/web-embed"]

[lints]
# 可选：继承工作区统一 lint 策略，不在单包放宽。
workspace = true

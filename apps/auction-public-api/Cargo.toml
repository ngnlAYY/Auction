[package]
name = "auction-public-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
auction-application.workspace = true
auction-config.workspace = true
auction-http.workspace = true
auction-jobs.workspace = true
auction-integrations.workspace = true
auction-storage.workspace = true
auction-observability.workspace = true
auction-process.workspace = true
rust-embed.workspace = true
auction-time.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[features]
# 可选：都不启用时只提供 API，不内嵌任何页面资源。
default = []
# 可选：内嵌 Dioxus 版的 Public 页面（默认技术栈），产物由 `mise run web-build` 生成。
web-embed = []
# 可选：内嵌 Solid 版的 Public 页面；`web-solid` 蕴含 `web-embed`，两者同时启用时以 Solid 为准。
web-solid = ["web-embed"]

[lints]
# 可选：继承工作区统一 lint 策略，不在单包放宽。
workspace = true

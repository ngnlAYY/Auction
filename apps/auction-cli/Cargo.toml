[package]
name = "auction-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
auction-application.workspace = true
auction-config.workspace = true
auction-contracts.workspace = true
auction-domain.workspace = true
# 必填：备份异机副本经 integrations 的 R2 客户端上传。
auction-integrations = { workspace = true, features = ["backup"] }
auction-observability.workspace = true
auction-process.workspace = true
auction-storage.workspace = true
chrono.workspace = true
clap.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# 必填：systemctl/pg_dump 子进程的有界读写。
tokio = { workspace = true, features = ["fs", "io-util", "process"] }
url.workspace = true
# 必填：部署与恢复回执使用确定性标识。
uuid = { workspace = true, features = ["v5"] }

[lints]
# 可选：继承工作区统一 lint 策略，不在单包放宽。
workspace = true

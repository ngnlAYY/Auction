[package]
name = "auction-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
auction-application.workspace = true
auction-config.workspace = true
auction-domain.workspace = true
# 必填：备份异机副本经 integrations 的 R2 客户端上传。
auction-integrations = { workspace = true, features = ["backup"] }
auction-observability.workspace = true
auction-process.workspace = true
auction-storage.workspace = true
auction-time.workspace = true
clap.workspace = true
jiff.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# 必填：systemctl/pg_dump 子进程的有界读写。
tokio = { workspace = true, features = ["fs", "io-util", "process"] }
url.workspace = true
uuid.workspace = true

[dev-dependencies]
# 可选：静态物化测试用挂载加载器与真实 CSP 核对写出的目录；只进测试。
auction-http.workspace = true
axum.workspace = true
rust-embed.workspace = true

[features]
# 可选：只用于本地调试构建开启未完成的一口价挂单；发布构建即使误带也拒开。
consignment-dev-preview = []

[lints]
# 可选：继承工作区统一 lint 策略，不在单包放宽。
workspace = true
